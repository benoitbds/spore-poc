# Configuration de la couche narrative SPORE v2.
#
# Distincte du genome L0 (data/l0_genome.yaml) : le genome est le terrain de
# mutation de L1, la couche narrative n'en fait pas partie. Aucune valeur de
# ce fichier n'influence la sélection ni la publication d'un brief.
#
# Chemins relatifs : ancrés à la racine du dépôt.

version: narrative_config_v1_iter6  # essai : rédacteur v2 (itération 2) + traducteur v2 (corrige le rejet mécanique « we »)

# Étiquette par défaut du registre de coût (v2_llm_costs.run_label).
# La variable d'environnement SPORE_V2_RUN_LABEL la remplace.
run_label: pipeline

timeouts:
  # Délai global du sous-graphe narratif, par brief (asyncio.wait_for).
  layer_total_s: 900
  # Délai d'un appel LLM (complete_json compris, rejeux internes compris).
  llm_call_s: 240
  # Délai des étapes mécaniques rejouées après un échec du sous-graphe.
  mechanical_tail_s: 60

# Rejeu avec backoff exponentiel des appels externes (pannes transitoires).
# Les troncatures, fins incomplètes et JSON invalides ne sont pas rejoués ici :
# complete_json les traite déjà une fois, au-delà c'est le contenu qu'il faut
# revoir.
retry:
  max_attempts: 3
  base_delay_s: 2.0
  max_delay_s: 30.0

# Limite du nombre d'étapes du sous-graphe (LangGraph recursion_limit).
recursion_limit: 50

story:
  # Tentatives par (brief, langue) : 1 + 2 nouvelles tentatives au plus.
  max_attempts: 3
  translate_max_attempts: 3
  # Fenêtre de l'année du récit, relative à l'année courante (UTC).
  year_offset_min: 10
  year_offset_max: 30
  # Longueur du corps, en mots.
  words:
    fr: [450, 750]
    en: [400, 820]
  title_max_chars: 120

writer:
  # Nom d'agent passé à get_llm_client ; absent du genome, il retombe sur
  # deepseek / deepseek-v4-flash (valeurs par défaut de get_provider_for_agent).
  agent: story_writer
  # provider/model à null : chemin standard get_llm_client(agent).
  # Renseignés, ils construisent le client explicitement (évaluation du repli
  # Anthropic sans toucher au genome).
  # Arbitrage du repli Anthropic (itération 4, docs/v2/calibration/iter4/fallback.md) :
  # les deux bras publient 9 récits FR et 9 EN sur 10 avec les mêmes prompts, mais
  # claude-sonnet-5 coûte 0,1188 USD par brief contre 0,0016 (× 74, soit ≈ 10,7 USD
  # pour le backfill des 90 briefs complets, plus que le plafond du run), refuse un
  # brief sur dix (finish_reason=refusal, aucun texte produit, trois tentatives) et
  # échange les défauts plutôt qu'il ne les réduit : meilleur sur les tics de surface,
  # moins bon sur la fin au carnet (5 récits sur 9 contre 0), le repère d'époque daté
  # (0 contre 3) et l'analogie du brief transplantée (4 sur 9 contre 2 sur 10). Le
  # rédacteur reste donc sur DeepSeek ; le repli automatique de get_llm_client, lui,
  # est inchangé et couvre toujours une panne du fournisseur.
  provider: null
  model: null
  # v2 (calibration, itération 2) : le jury n'a accepté que 6 récits FR et 3 EN
  # sur 10 à l'itération 1. v2 ajoute six règles d'écriture tirées des refus,
  # avant les règles NEVER/ALWAYS : glose obligatoire de tout terme technique
  # porteur de la chaîne causale (816D, 072C), une seule image et elle doit être
  # exacte (8B20 : sphère coupée par un plan donnant une « hyperbole »), un arc
  # de scène au lieu d'un cahier de manipulation (2A88, 072C), une phrase disant
  # ce que ça change pour quelqu'un (816D), aucune valeur de paramètre dans les
  # 80 premiers mots (35F1, 816D), un détail d'époque dans le corps (13 récits
  # sur 14 sans aucun repère temporel). S'y ajoutent trois interdictions :
  # vocabulaire éditorial de SPORE dans le corps (« La prédiction du brief
  # tenait »), littérature citée même anonyme (« un article méthodologique »),
  # et nom de lieu retrouvable sur une carte (« Sainte-Rose-du-Nord », publié en
  # FR et rejeté trois fois en EN par le juge, sur le même nom). La cible de
  # longueur passe de « 12 à 15 paragraphes » à 600-680 mots comptés : deux
  # tentatives FR sont passées sous le plancher de 450 avec la consigne en
  # paragraphes. Les tentatives sont des tirages indépendants (aucune raison de
  # rejet n'est réinjectée) : le prompt doit réussir au premier tirage.
  # v3 (calibration, itération 3) : le jury a accepté 8 récits FR et 7 EN sur
  # 10 à l'itération 2. Cause racine du défaut le plus visible, vérifiée par
  # grep sur les onze récits : les exemples « ✓ » de v2 étaient recopiés
  # littéralement d'un brief à l'autre — « Une heure, c'est déjà une planète »
  # (B4) dans D3A8, « à quoi ça sert ? » (B4) dans 2A88 et FBCA, la courbe qui
  # descend alors qu'elle devrait monter (B3) dans A08D et D3A8, le mètre ruban
  # avec sa règle métallique (B2) comme image ET comme titre de D3A8. Le jury
  # attribuait cette dernière à la vulgarisation du brief : elle venait du
  # prompt. v3 supprime tous les exemples « ✓ » citables et les inscrit dans
  # les interdictions, avec la liste des prénoms déjà publiés (Malik dans 5
  # récits sur 11, Inès dans 3). S'y ajoutent quatre règles tirées des refus :
  # unité et point de comparaison sur tout nombre prononcé (816D, 35F1, 8B20,
  # 0669), un fait matériel qui change et une limite qui passe par ce fait au
  # lieu d'être récitée (refus de FBCA et 35F1), un titre qui ne promet que
  # l'image réellement développée (0669, 35F1, D3A8), et l'interdiction de deux
  # termes opaques dans une même réplique (A08D, FBCA). Le repère d'époque,
  # absent des 11 récits, passe des « deux premiers paragraphes » obligatoires.
  # Enfin une section H « avant de rendre » place en toute fin les deux
  # contrôles mécaniques qui tuent : recherche littérale de « nous » (35F1 fr
  # a1, accepté par les deux jurés, est mort sur une occurrence) et unités.
  # v4 (calibration, itération 4) : le jury est retombé à 7 récits FR et 6 EN
  # sur 10 à l'itération 3, après 8 et 7 à l'itération 2. Trois régressions
  # datées par grep sur les récits FR des trois itérations : (a) l'ouverture
  # « Depuis que X…, plus personne n'y prêtait attention » dans 10 récits sur
  # 10, contre 0 sur 14 à l'itération 1 et 0 sur 11 à l'itération 2 ; (b) le
  # prénom Idriss dans 5 récits sur 10, absent des deux itérations
  # précédentes ; (c) la fin au carnet dans 8 récits sur 10, contre 6 sur 14
  # et 3 sur 11. La règle B7 de v3 (« un détail d'époque dans les deux
  # premiers paragraphes », « le repère porte sur le monde autour du
  # laboratoire ») se satisfaisait au moindre coût par une phrase d'ambiance
  # boulonnée en tête, et a probablement poussé 816D hors de son domaine : le
  # même brief avait produit un récit fidèle aux métalloprotéines à
  # l'itération 2, et l'itération 3 l'a transposé sur la quille en acier d'un
  # chalutier (rejet ferme des deux jurés, FR et EN). v4 sépare les deux
  # choses. Le repère devient B9 : R1 datable dans les cent premiers mots
  # (année prononcée OU technologie qu'on ne peut pas confondre avec 2026 ;
  # six récits sur dix étaient indatables — pénurie de filtres, impression de
  # pièces sur place, traçabilité des prélèvements, carnets papier remplacés)
  # et R2 dont l'intrigue a besoin (test : le retirer casse une scène plus
  # loin), la phrase d'ambiance d'ouverture étant interdite nommément. La
  # fidélité au domaine devient B10 : pas de substitution d'objet
  # scientifique, pas de grandeur que la méthode du brief ne produit pas, le
  # geste qui répare appartient au domaine du problème (A08D : un chiffon sur
  # un tube qui « stabilise le gradient » d'un calcul), aucun saut de la
  # paillasse vers le malade (35F1 : un transcriptome à sept jours qui
  # déclenche une opération le lendemain ; FBCA : l'espoir d'une sœur malade
  # posé sur un essai de lyse en puits de culture, sans phrase de distance).
  # S'y ajoutent quatre règles tirées des refus : B2, le lecteur doit pouvoir
  # dire POURQUOI ça marche et pas seulement ce que ça donne (8B20 répète six
  # fois « deux solutions » sans jamais dire qu'il y a plus d'inconnues que
  # d'équations) ; B3, l'arithmétique du chiffre pivot (35F1 : un quart plus
  # un cinquième conclu comme « presque » un tiers ; 0669 : la même borne à
  # dix pour mille puis à un pour mille) ; B4, l'image se fabrique avec les
  # objets de la scène, l'analogie du brief ne se transplante pas dans une
  # réplique (2A88) et ne s'abandonne pas sans remplacement (8B20, 816D,
  # A08D) ; B7, un vrai désaccord entre personnages au lieu du duo
  # pédagogique (8 récits sur 10). B5 interdit la fin au carnet et la morale
  # dite en dernière ligne, B6 impose le prix compté en objets (« six
  # pastilles au lieu de douze »), B11 élargit la liste des prénoms brûlés et
  # impose des origines différentes dans un même récit. Les champs de
  # contrôle passent de deux à quatre (era_r1, era_r2, why_it_works,
  # title_image) : normalise_story ne garde que les six champs du récit, ils
  # ne coûtent donc que des jetons de sortie.
  # v5 (calibration, itération 5) : le jury n'a retenu que 4 récits FR et 6 EN
  # sur 10 à l'itération 4, après 8/7 (itération 2) et 7/6 (itération 3). La
  # série des versions est donc monotone décroissante en FR depuis v2, et la
  # méthode qui l'a produite — ajouter à chaque tour les règles tirées des
  # refus du tour précédent — est elle-même la cause : v2 faisait 138 lignes,
  # v4 en fait 211, et le juré lecteur décrit treize récits sur treize bâtis
  # sur le même gabarit (un laboratoire, un scientifique et un technicien, une
  # mesure limite, une dispute sur « est-ce qu'on publie », une fin
  # administrative). v5 repart donc de v2, pas de v4 : les ajouts de v3 et v4
  # ne sont repris que lorsqu'ils corrigent un défaut observé sur des récits
  # produits par v2 (fidélité au domaine, interdiction des questions à « on »,
  # arithmétique du chiffre pivot), et non lorsqu'ils soignaient un dégât
  # causé par la version précédente (liste de prénoms brûlés étendue, phrase
  # d'ambiance d'ouverture, fin au carnet : aucun de ces défauts n'existait
  # avant v3). Cinq changements de fond, tirés du bilan du juré lecteur :
  # (a) B1 déplace la scène — la méthode est DÉJÀ en service, la décision
  # finale appartient à quelqu'un qui n'est pas chercheur, et le laboratoire,
  # le duo sachant/technicien, la délibération « est-ce qu'on publie » et la
  # fin administrative sont interdits comme cadre principal ; c'est la lecture
  # littérale de <editorial_concept> (« Et si ça marchait ? », les
  # conséquences humaines), et le seul récit à moitié sorti du laboratoire
  # (BFF6, agriculteurs et coopératives) est celui que le juré a préféré ;
  # (b) B2 impose la glose du MOT-SUJET à sa première occurrence et avant tout
  # chiffre — première cause de refus, mesurée : « mode » ×12 (0669),
  # « gradient » ×10 (A08D a1), « pilote » et « canal » (8B20), « fonction
  # d'onde » (816D) ; (c) B4 interdit les seuils énoncés en écarts
  # statistiques sans unité ni ancrage (« deux fois et demie la variabilité
  # attendue par hasard ») et refait porter le calcul du chiffre pivot ;
  # (d) B5 interdit d'énoncer le succès au présent de vérité générale
  # (« La correction fonctionne ») ou de l'adosser à une réglementation
  # (« obligatoire depuis la directive de 2041 ») : quatre récits sur treize
  # ont laissé le juré croire que la technique existe et marche aujourd'hui,
  # ce qui est la ligne des garde-fous ; (e) B7 exige que la limite change une
  # décision ou un résultat, et non qu'elle soit débattue en leçon de morale
  # (les trois tentatives de 35F1 rejouent la même dispute « publier vite pour
  # les malades » contre « publier honnêtement »). B6 demande deux repères
  # d'époque, dont un dans les cent premiers mots, une date seule ne suffisant
  # pas. Les cinq formulations que le juré cite en exemple ne sont PAS
  # recopiées ici : v3 avait établi par grep que les exemples « ✓ » citables
  # de v2 se retrouvaient mot pour mot d'un brief à l'autre ; elles sont
  # décrites comme cible dans le prompt du garde, où les copier est sans
  # effet. Trois champs de contrôle (glose, epoque, pour_qui) remplacent les
  # quatre de v4 et se recopient mot pour mot depuis le corps.
  # Prédiction falsifiable pour l'itération 6 : si v5 échoue, les récits FR
  # de l'itération 5 conserveront le cadre laboratoire malgré B1 (mesurable
  # par le champ constats.scène_principale du garde) ; si v5 réussit, la
  # première cause de refus cessera d'être le mot-sujet non glosé.
  # Résultat de cette prédiction, relevé sur les rapports du garde de
  # l'itération 5 (champs judge.constats) : v5 a bien obtenu les deux choses
  # qu'il visait — aucune des 17 tentatives FR ne se passe dans un laboratoire
  # (ateliers, centre de tri, salle de contrôle d'opérateur, clinique
  # vétérinaire ; la décision finale revient à un non-chercheur dans 8 relevés
  # sur 8) et le mot-sujet est glosé à sa première ou deuxième apparition dans
  # les 8 relevés. Le jury est pourtant retombé à 5 récits FR sur 10. La
  # prédiction est donc falsifiée dans sa branche « le cadre laboratoire
  # persistera » : v5 échoue en ayant corrigé ses deux cibles. C'est la méthode
  # elle-même — ajouter à chaque tour les règles tirées des refus du tour
  # précédent — qui ne converge pas.
  #
  # BILAN DE LA CALIBRATION (5 itérations, docs/v2/calibration/RESULT.md) : le
  # seuil de <narrative_layer> — au moins 8 récits sur 10 acceptés par le jury
  # sans retouche — n'est atteint par AUCUNE itération dans les deux langues.
  # La meilleure est l'itération 2 : FR 8/10 (seuil atteint), EN 7/10 (seuil
  # manqué d'un récit), 3 faux accepts, le minimum de la série. Elle domine les
  # quatre autres sur les trois mesures à la fois, et la série FR décroît
  # ensuite (8 → 7 → 4 → 5). Ce sont donc les versions de l'itération 2 qui
  # sont conservées ici, et non les dernières écrites : story_writer_v2,
  # story_guard_v1, story_translate_v1. Les fichiers v3 à v5 restent au dépôt,
  # mesurés et documentés, pour reprendre la calibration ; ils ne sont pas la
  # configuration.
  prompt: story_writer_v2
  temperature: 0.8
  # ~750 mots FR ≈ 1 300-1 650 jetons, plus l'enveloppe JSON et les champs
  # mechanism / limit_or_risk. Plafond, pas facture : la troncature a été la
  # première cause d'échec des critics.
  max_tokens: 4000

guard:
  agent: story_guard
  provider: null
  model: null
  # v1 (itération 2) : v0 notait 8 ou 9 en lisibilité des récits que le jury
  # refusait pour mur de jargon, et rejetait à l'inverse des récits acceptés par
  # le jury sur une simple incertitude de nom propre. v1 remplace l'impression
  # générale par des tests : reformulation de la chaîne cause → effet avec les
  # seuls mots courants du texte (readable_at_15), reconnaissance positive et
  # non incertitude pour les entités réelles (no_real_entities), inflation
  # chiffrée et image fausse (fidelity), vocabulaire éditorial de SPORE
  # (not_claimed_proven), limite jouée et non récitée (limit_present), anglais
  # agrammatical et « people » générique (readable_at_15, EN). Il dit aussi
  # explicitement que « doubts » ne contient que des motifs de rejet, puisque
  # evaluate_verdict rejette sur toute entrée non vide : les observations non
  # bloquantes (époque, enjeu, chiffres en tête) vont dans « reasons ».
  # v2 (itération 3) : v1 a publié trois récits que le jury a refusés (35F1 fr,
  # 35F1 en, FBCA fr) en notant readable_at_15 à 9 sur deux d'entre eux, et a
  # manqué une contradiction interne (fidelity 8 sur un récit qui dit à la fois
  # qu'un muscle n'a pas repoussé et que ses fibres sont 35 % plus grosses).
  # L'impression générale résistait aux tests énoncés : v2 impose d'abord un
  # relevé factuel (« constats »), écrit avant les notes — termes non glosés
  # portant la chaîne causale, nombres sans unité, image et scène de secours,
  # fait qui change, résultat établi, contradiction, repère d'époque. Les notes
  # découlent du relevé. Le test de lisibilité devient à deux temps pour ne pas
  # rejeter ce que le jury accepte : A08D, jugé « rafale de jargon comparable »
  # à 816D, a été accepté parce qu'il offrait une analogie utilisable et une
  # scène compréhensible sans vocabulaire ; le rejet n'est prononcé que si le
  # secours manque aussi. « doubts » est restreint à cinq motifs énumérés
  # (evaluate_verdict rejette sur toute entrée non vide) ; l'absence de repère
  # d'époque, un outil réel repris du brief et un titre trompeur restent des
  # observations. max_tokens passe de 1500 à 2200 : le relevé s'ajoute au
  # verdict, et une sortie tronquée serait un faux rejet.
  # v3 (itération 4) : v2 a publié sept récits que le jury a refusés (8B20 fr
  # et en, 816D fr et en, 35F1 fr, FBCA en, 0669 en) — c'est l'échec le plus
  # grave, puisqu'il n'y a pas de jury en production. Aucun de ces sept refus
  # n'entrait dans les cinq motifs de rejet de v2 : les défauts tombaient tous
  # dans « reasons », donc sans effet. v3 porte la liste à dix motifs, chacun
  # doublé d'une bande de notes sous le seuil pour que le rejet passe aussi
  # par evaluate_verdict : substitution de domaine (816D), incohérence
  # arithmétique (35F1, 0669), geste qui répare hors du domaine du problème
  # (A08D, 35F1), attente médicale non bornée (FBCA), raison jamais donnée
  # (8B20). Chaque motif est assorti de sa contre-indication, tirée des récits
  # que le jury a acceptés, pour ne pas rejeter ce qui va : un changement de
  # décor n'est pas une substitution de domaine ; un chiffre isolé imprécis
  # rattrapé plus loin est une observation ; un malade dans la scène est
  # permis dès qu'une phrase dit la distance restante (35F1 a été accepté par
  # le juré chercheur sur ce point précis, FBCA refusé faute de cette phrase).
  # Le relevé factuel s'étend en conséquence : objet du brief contre objet du
  # récit, la raison en une phrase avec les mots du récit, les nombres avec
  # leur rôle (annoncé, mesuré, rappelé) et le calcul posé, le geste qui
  # résout, l'attente médicale. L'absence de repère d'époque reste une
  # observation et non un rejet : en faire un motif aurait supprimé quatre
  # récits que le jury a acceptés à l'itération 3, et les tentatives étant des
  # tirages indépendants, un garde trop strict ne produit pas un meilleur
  # récit mais pas de récit du tout. Écart assumé avec la ligne du juré
  # lecteur sur 0669 (« chiffre isolé à corriger ») : le juré chercheur a
  # refusé la version EN du même récit sur cette borne contradictoire, donc le
  # motif 7 vise aussi le cas où une même grandeur reçoit deux valeurs
  # incompatibles. B6 signale en plus les répliques anglaises introduites par
  # un tiret cadratin (BFF6 en a1).
  # v4 (itération 5) : v3 a publié neuf récits que le jury a refusés (0669 fr
  # et en, 072C fr, 816D fr et en, 8B20 fr, D3A8 fr, A08D en), et huit des dix
  # briefs FR n'ont consommé qu'une seule tentative sur les trois autorisées.
  # C'est là que se joue l'écart au seuil : les tirages sont indépendants, un
  # garde qui rejette ce que le jury rejette rend deux tirages de plus. Le
  # diagnostic de v3 → v4 n'est pas « il manque des motifs » (v2 → v3 était
  # déjà passé de cinq à dix motifs sans effet) mais « le relevé n'est pas
  # fait » : sur 0669 fr, le juge a noté readable_at_15 à 9 et fidelity à 9,
  # doubts vide, sur un récit où « mode » revient douze fois sans glose et où
  # une mesure de trois dixièmes de pour cent est annoncée comme « trois fois
  # au-dessus » d'une tolérance de un pour cent. v4 retire donc la décision au
  # juge : il répond à DIX CONTRÔLES FERMÉS (oui / non / sans objet), chacun
  # adossé à un constat cité, et c'est Python (guard.evaluate_controls) qui en
  # déduit le rejet, drapeau guard.require_controls. Une réponse défavorable,
  # absente ou illisible rejette (fail-closed). « doubts » retombe à cinq
  # motifs résiduels (entité réelle, promesse, exclusion de la constitution,
  # corps vide, chaîne cause → effet irrécupérable) pour ne pas faire double
  # emploi. Les constats sont désormais exportés dans le rapport : à
  # l'itération 4 ils n'y figuraient pas, donc personne ne pouvait vérifier si
  # le relevé avait eu lieu. Trois contrôles sont nouveaux et viennent du
  # bilan du juré : mot_sujet_glose (première cause de refus),
  # chiffre_pivot_lisible (seuils en rapports sans unité) et
  # succes_enonce_comme_loi (le récit qui fait croire que la technique marche
  # aujourd'hui). L'absence de repère d'époque reste une observation et non un
  # rejet : en faire un motif aurait supprimé quatre récits acceptés à
  # l'itération 3, et un garde trop strict ne produit pas un meilleur récit
  # mais pas de récit du tout. Le fait que le récit se passe dans un
  # laboratoire reste lui aussi une observation à l'itération 5 : c'est au
  # rédacteur de sortir du laboratoire, et rejeter là-dessus dès le premier
  # tour risquerait de vider la publication pendant que v5 se cale.
  # Version conservée après la calibration : v1, celle de l'itération 2. Sur
  # la mesure qui compte pour un garde — les faux accepts, c'est-à-dire les
  # récits publiés que le jury a ensuite refusés, et il n'y a pas de jury en
  # production — v1 est le meilleur des quatre gardes essayés : 3 faux accepts
  # à l'itération 2, contre 8 (v0), 7 (v2), 8 (v3) et 6 (v4). L'élargissement
  # successif des motifs de rejet (5 → 10 motifs de v2 à v3, puis les dix
  # contrôles fermés de v4) n'a jamais fait baisser ce chiffre. Réserve
  # honnête : garde et rédacteur ont changé ensemble à chaque tour, donc ces
  # faux accepts ne sont pas imputables au seul garde ; v1 est retenu parce
  # qu'il appartient à l'itération la mieux notée, pas parce qu'il aurait été
  # isolément démontré meilleur.
  prompt: story_guard_v1
  temperature: 0.0
  max_tokens: 2600
  # Exiger le bloc « controles » et en déduire le rejet en Python (v4+).
  # OBLIGATOIREMENT false avec un prompt antérieur à v4 : seul story_guard_v4
  # demande au juge de produire le bloc « controles ». Laissé à true avec v1,
  # le bloc serait absent à chaque appel, evaluate_controls rejetterait
  # (fail-closed, « judge:controls_missing ») et plus aucun récit ne serait
  # publié. Le drapeau et la version du prompt se déplacent ensemble.
  require_controls: false
  # Échelle des notes du juge : entiers de 0 à 10.
  score_min: 0
  score_max: 10
  # Seuil par défaut ; toute note strictement inférieure rejette.
  threshold: 7
  # Seuils plus stricts sur les critères de sécurité.
  thresholds:
    no_real_entities: 9
    constitution_exclusions: 9
    no_promise_or_advice: 8
    not_claimed_proven: 8
  # Sauter le juge quand les contrôles mécaniques ont déjà rejeté (économie).
  skip_judge_on_mechanical_failure: true
  # « nous / notre / nos » (FR) et « we / our / us » (EN) rejetés partout,
  # dialogues compris : un contrôle mécanique ne distingue pas le « nous »
  # éditorial d'une réplique. Chaque rejet est consigné dans le rapport
  # (catégorie first_person_plural) pour que la calibration le mesure.
  # Maintenu à l'itération 2 : le juré chercheur proposait de lever la règle
  # pour les dialogues anglais, mais ce serait ouvrir le « nous » éditorial au
  # contrôle mécanique, qui ne sait pas distinguer les deux. Le défaut qu'il
  # décrit (« people » partout) est corrigé dans story_translate_v1, qui donne
  # au traducteur des tournures anglaises naturelles sans première personne du
  # pluriel.
  strict_first_person_plural: true

translate:
  # Même chemin client que translation_hook (scripts/translate_brief_*.py).
  agent: translation
  provider: null
  model: null
  # v1 (itération 2) : deux récits FR acceptés par les deux jurés ont été
  # rejetés en anglais pour la seule traduction (0669, 2A88). v0 interdisait
  # « we » partout, le traducteur rendait « on » par « people » et produisait
  # des répliques agrammaticales (« Shall people start again… »), justement sur
  # les phrases qui portent la conclusion. v1 interdit « people » en sujet
  # générique et donne une échelle de rendus (ellipse ou impératif, première
  # personne du singulier, personnage nommé, groupe présent, « you » parlé,
  # voix passive), plus l'obligation de conserver les gloses et l'image centrale
  # du français.
  # v2 (itération 3) : la traduction EN de 2A88 a été rejetée trois fois par le
  # contrôle mécanique sur une seule occurrence de « we're », au même endroit à
  # chaque tentative (« Non. Cette fois, on va le voir. » → « No. This time,
  # we're going to see it. »), alors que les deux jurés acceptaient les trois
  # tentatives. À température 0,2 et sans réinjection du motif de rejet, les
  # tentatives sont identiques : seul le prompt peut corriger. v2 ouvre sur ce
  # cas précis, l'ajoute au premier barreau de l'échelle, nomme les trois
  # pièges qui produisent « we » sans prévenir (impératif de première personne
  # du pluriel, « on » de connivence, réécriture de dernière minute), et
  # termine par une section G de quatre contrôles sur le texte fini, dont la
  # recherche littérale des suites de lettres, contractions comprises. S'y
  # ajoutent trois obligations tirées des refus EN : conserver l'unité ET le
  # point de comparaison de chaque nombre (816D en, refusé trois fois par le
  # juré lecteur pour des nombres nus), conserver le repère d'époque, et
  # conserver l'image centrale jusque dans le titre.
  # v3 (itération 4) : diff minimal sur v2. Sur les cinq refus EN de
  # l'itération 3, quatre étaient hérités du français (chiffre contradictoire,
  # substitution de domaine, mécanisme jamais expliqué, attente médicale) et
  # un seul venait du traducteur : BFF6 en a1, dont les quatorze répliques
  # gardaient le tiret cadratin français, refusé par le juré chercheur pour ce
  # seul motif, la tentative 2 étant acceptée à contenu identique une fois les
  # guillemets posés. v2 le demandait dans une incise d'une ligne de la
  # section ALWAYS ; v3 en fait une règle à part entière avec son exemple, et
  # ajoute le contrôle G5 sur le premier caractère de chaque ligne du corps.
  # Rien d'autre n'est touché : le reste des refus EN se corrige en français.
  # Itération 5 : v3 est conservé, sans nouvelle version. Les trois refus EN
  # de l'itération 4 (0669, 816D, A08D) sont hérités du français — mot-sujet
  # non glosé, chiffre contradictoire, mécanisme jamais expliqué — et se
  # corrigent dans story_writer_v5 ; aucun refus EN n'est imputable au
  # traducteur. Changer trois prompts le même tour a rendu les itérations 3 et
  # 4 inattribuables : v5 ne bouge que le rédacteur et le garde.
  # Version conservée après la calibration : v1, celle de l'itération 2, parce
  # que la configuration retenue est le TRIPLET de l'itération 2 et non un
  # assemblage de versions jamais essayées ensemble. C'est le point coûteux de
  # cet arbitrage, et il est écrit tel quel dans RESULT.md : l'écart au seuil
  # en EN (7/10) vient pour deux tiers du traducteur v1. Deux briefs n'ont
  # eu aucun récit anglais à l'itération 2, tous deux tués par le contrôle
  # mécanique strict_first_person_plural sur les trois tentatives (SPR-2026-2A88
  # et SPR-2026-816D) ; sur 2A88, les deux jurés acceptaient les trois
  # tentatives, le garde les a refusées sur une seule occurrence de « we're ».
  # C'est exactement ce que v2 a corrigé : à l'itération 3, 10 récits EN sur 10
  # publiés et zéro rejet mécanique. Mais writer_v2 + translate_v2 n'a jamais
  # tourné : à l'itération 3, le rédacteur avait changé en même temps. Prendre
  # v2 ici reviendrait à figer une combinaison non mesurée et à déclarer un
  # seuil atteint qui ne l'a pas été. La combinaison est consignée comme
  # première reprise à tenter (RESULT.md, « Ce qui reste à faire »), pas comme
  # configuration.
  prompt: story_translate_v2
  temperature: 0.2
  max_tokens: 4000

themes:
  path: config/narrative/themes_v1.json

# Nœud explainer_flags (D-017, sans LLM) : signalements sur la vulgarisation
# du pipeline (niveau 2), écrits dans v2_vocab_flags. Les trois fichiers sont
# des copies octet pour octet de spore-v2/scripts/v2/checks/ (le front lit les
# originaux) : rule_idx désigne le même motif des deux côtés.
explainer_flags:
  vocab_rules: config/narrative/vocab_rules.json
  status_rules: config/narrative/status_rules.json
  vocab_allow: config/narrative/vocab_allow.txt

neighbours:
  # Voisines sortantes par idée complète : cible, bornes.
  target: 4
  min: 3
  max: 5
  # Liens entrants minimaux par idée complète publiée.
  min_inbound: 3
  # Liens de l'anneau des stubs (entrants et sortants).
  stub_ring: 3

paths:
  # Denylist d'identité (non versionnée, jamais affichée). Absente ou vide :
  # le contrôle échoue, donc le récit est rejeté (fail-closed).
  identity_denylist: .identity_denylist
  # Lue en lecture seule pour les exclusions éthiques (juge du garde).
  constitution: data/constitution.yaml
  # Cartes de domaines (lecture seule) : nom exact → parent_domain, pour
  # theme_tagger. Deux formes : disciplines[].subdomains[] et subdomains[].
  domain_maps:
    - data/domains/all_science.json
    - data/domains/materials_science.json

backfill:
  rate_limit_s: 2.0
  default_cap_usd: 10.0
  # Estimation prudente du coût d'un brief (FR + EN, gardes compris, 3 essais).
  estimated_usd_per_brief: 0.02
  # Toutes les étiquettes du run (DATA_CONTRACT.md, M7.cost) : tout sauf « pipeline ».
  capped_labels: [calibration, canary, backfill, catchup, theme_proposal, e2e, regen]
  spend_json: /home/baq/Projects/spore-v2/docs/v2/evidence/spend.json
