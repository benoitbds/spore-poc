  distance_score: 0.623846173286438
  domain_a:
    context_abstracts:
    - '[Leveraging LLMs to Automate Software Architecture Design from Informal Specifications
      (2025)]

      Designing a software architecture starting from specifications and requirements
      is a time-consuming and errorprone process that demands domain expertise. Automating
      this process has become a significant research focus in software engineering.
      Traditional approaches rely on rule-based mechanisms to translate manually derived,
      standardized requirements into the desired architecture. However, these methods
      struggle to identify implicit patterns without expert intervention. Recently,
      approaches leveraging Large Language Models (LLMs) have gained attention. This
      study evaluates the performance of LLMs in generating software architecture
      blueprints, specifically UML component diagrams, from informal natural-language
      specifications. We develop a formal characterization of component diagrams to
      derive quantitative metrics for analyzing LLM-generated diagrams, comparing
      them against expert-drawn ground truths associated with the specifications.
      Our findings indicate that while LLM-based approaches show promise in addressing
      the flaws of rule-based methods, they currently lack the accuracy needed for
      deployment in real-world scenarios.'
    - '[Understanding microservices architecture: Building scalable and resilient
      systems (2025)]

      Microservices architecture represents a paradigm shift in software design, breaking
      monolithic applications into independently deployable services with clear boundaries
      and responsibilities. This article explores the fundamental principles of microservices,
      tracing their evolution from service-oriented architecture while examining strategic
      decomposition methodologies, domain modeling, and API design. It investigates
      communication patterns between services, comparing synchronous and asynchronous
      models, and addresses the challenges of distributed data management through
      patterns like event sourcing and sagas. Implementation challenges, including
      operational complexity, testing strategies, security considerations, and performance
      optimization, are assessed alongside organizational impacts stemming from Conway''s
      Law. Through industry case studies spanning e-commerce, media streaming, transportation,
      and financial services sectors, the article documents quantifiable benefits
      in deployment frequency and system resilience while acknowledging common pitfalls.
      Migration strategies such as the strangler pattern and incremental adoption
      provide practical guidance for organizations transitioning from monoliths. The
      article concludes with emerging trends, including serverless architectures,
      service mesh technology, and hybrid approaches that suggest future directions
      for distributed system design.'
    - '[Online software design for short-term load forecasting based on design patterns
      (2024)]

      In response to the limitations inherent in methodologies reliant upon manual
      operations and practical experiences, commonly employed within the domain of
      load forecasting, such as convoluted operational procedures and suboptimal accuracy
      rates, this study introduces a novel online short-term load forecasting software
      solution. The developed software leverages cross-platform programming languages,
      notably Java and Python, alongside an object-relational mapping (ORM) framework
      to encapsulate database interactions, while adopting a browser/server (B/S)
      architecture. Furthermore, the software’s development process incorporates appropriate
      design patterns from object-oriented design (OOD), establishes an exception-handling
      architecture, and adheres to principles of test-driven development (TDD) to
      uphold superior software quality standards. Upon completion of construction
      and rigorous testing, the online short-term load forecasting software exhibits
      exceptional responsiveness to evolving functional requirements, thereby demonstrating
      its adaptability and scalability. Furthermore, its sustained operation over
      an extended duration underscores both its engineering feasibility and intrinsic
      software quality.'
    - '[Morescient GAI for Software Engineering (Extended Version) (arXiv:2406.04710,
      2024)]

      The ability of Generative AI (GAI) technology to automatically check, synthesize
      and modify software engineering artifacts promises to revolutionize all aspects
      of software engineering. Using GAI for software engineering tasks is consequently
      one of the most rapidly expanding fields of software engineering research, with
      over a hundred LLM-based code models having been published since 2021. However,
      the overwhelming majority of existing code models share a major weakness - they
      are exclusively trained on the syntactic facet of software, significantly lowering
      their trustworthiness in tasks dependent on software semantics. To address this
      problem, a new class of "Morescient" GAI is needed that is "aware" of (i.e.,
      trained on) both the semantic and static facets of software. This, in turn,
      will require a new generation of software observation platforms capable of generating
      large quantities of execution observations in a structured and readily analyzable
      way. In this paper, we present a vision and roadmap for how such "Morescient"
      GAI models can be engineered, evolved and disseminated according to the principles
      of open science.'
    - '[Software Engineering in Civic Tech: A Case Study about Code for Ireland (arXiv:1904.04104,
      2019)]

      Civic grassroots have proven their ability to create useful and scalable software
      that addresses pressing social needs. Although software engineering plays a
      fundamental role in the process of creating civic technology, academic literature
      that analyses the software development processes of civic tech grassroots is
      scarce. This paper aims to advance the understanding of how civic grassroots
      tackle the different activities in their software development processes. In
      this study, we followed the formation of two projects in a civic tech group
      (Code for Ireland) seeking to understand how their development processes evolved
      over time, and how the group carried out their work in creating new technology.
      Our preliminary findings show that such groups are capable of setting up systematic
      software engineering processes that address software specification, development,
      validation, and evolution. While they were able to deliver software according
      to self-specified quality standards, the group has challenges in requirements
      specification, stakeholder engagement, and reorienting from development to product
      delivery. Software engineering methods and tools can effectively support the
      future of civic technologies and potentially improve their management, quality,
      and durability.'
    - '[Cognitive Biases in Software Engineering: A Systematic Mapping Study (arXiv:1707.03869,
      2017)]

      One source of software project challenges and failures is the systematic errors
      introduced by human cognitive biases. Although extensively explored in cognitive
      psychology, investigations concerning cognitive biases have only recently gained
      popularity in software engineering (SE) research. This paper therefore systematically
      maps, aggregates and synthesizes the literature on cognitive biases in software
      engineering to generate a comprehensive body of knowledge, understand state
      of the art research and provide guidelines for future research and practise.
      Focusing on bias antecedents, effects and mitigation techniques, we identified
      65 articles, which investigate 37 cognitive biases, published between 1990 and
      2016. Despite strong and increasing interest, the results reveal a scarcity
      of research on mitigation techniques and poor theoretical foundations in understanding
      and interpreting cognitive biases. Although bias-related research has generated
      many new insights in the software engineering community, specific bias mitigation
      techniques are still needed for software professionals to overcome the deleterious
      effects of cognitive biases on their work.'
