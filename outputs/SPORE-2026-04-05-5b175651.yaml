    context_abstracts:
    - '[One For All: LLM-based Heterogeneous Mission Planning in Precision Agriculture
      (arXiv:2506.10106, 2025)]

      Artificial intelligence is transforming precision agriculture, offering farmers
      new tools to streamline their daily operations. While these technological advances
      promise increased efficiency, they often introduce additional complexity and
      steep learning curves that are particularly challenging for non-technical users
      who must balance tech adoption with existing workloads. In this paper, we present
      a natural language (NL) robotic mission planner that enables non-specialists
      to control heterogeneous robots through a common interface. By leveraging large
      language models (LLMs) and predefined primitives, our architecture seamlessly
      translates human language into intermediate descriptions that can be executed
      by different robotic platforms. With this system, users can formulate complex
      agricultural missions without writing any code. In the work presented in this
      paper, we extend our previous system tailored for wheeled robot mission planning
      through a new class of experiments involving robotic manipulation and computer
      vision tasks. Our results demonstrate that the architecture is both general
      enough to support a diverse set of robots and powerful enough to execute complex
      mission requests. This work represents a significant step toward making robotic
      automation in precision agriculture more accessible to non-technical users.'
    - '[Designing and Implementing Data Warehouse for Agricultural Big Data (arXiv:1905.12411,
      2019)]

      In recent years, precision agriculture that uses modern information and communication
      technologies is becoming very popular. Raw and semi-processed agricultural data
      are usually collected through various sources, such as: Internet of Thing (IoT),
      sensors, satellites, weather stations, robots, farm equipment, farmers and agribusinesses,
      etc. Besides, agricultural datasets are very large, complex, unstructured, heterogeneous,
      non-standardized, and inconsistent. Hence, the agricultural data mining is considered
      as Big Data application in terms of volume, variety, velocity and veracity.
      It is a key foundation to establishing a crop intelligence platform, which will
      enable resource efficient agronomy decision making and recommendations. In this
      paper, we designed and implemented a continental level agricultural data warehouse
      by combining Hive, MongoDB and Cassandra. Our data warehouse capabilities: (1)
      flexible schema; (2) data integration from real agricultural multi datasets;
      (3) data science and business intelligent support; (4) high performance; (5)
      high storage; (6) security; (7) governance and monitoring; (8) replication and
      recovery; (9) consistency, availability and partition tolerant; (10) distributed
      and cloud deployment. We also evaluate the performance of our data warehouse.'
    - '[Agricultural Policy in Ukraine (arXiv:2305.01478, 2023)]

      Building upon the theory and methodology of agricultural policy developed in
      the previous chapter, in Chapter 2 we analyse and assess agricultural policy
      making in Ukraine since the breakup of Soviet Union till today. Going from top
      down to the bottom, we begin by describing the evolution of state policy in
      the agri-food sector. In the beginning, we describe the major milestones of
      agricultural policy making since independence, paving the way to the political
      economy of the modern agricultural policy in Ukraine. Then we describe the role
      of agri-food sector in the national economy as well as globally in ensuring
      food security in the world. After, we dig deeper and focus on a detailed performance
