impact_analysis:
  horizon_temporel: Moyen terme (3-10 ans)
  impact_concret: Cette découverte permettrait de fabriquer des médicaments avec moins
    d'effets secondaires, de réduire drastiquement les déchets chimiques dans l'industrie,
    et de créer de nouveaux matériaux impossibles à obtenir aujourd'hui. Les coûts
    de production pharmaceutique pourraient chuter, rendant les traitements plus accessibles.
    L'industrie chimique deviendrait plus verte en produisant exactement ce qu'elle
    veut sans gaspillage.
  industries_impactees:
  - Pharmaceutique
  - Chimie fine
  - Pétrochimie
  - Matériaux avancés
  - Agrochimie
  - Cosmétique
  one_liner: Des cages moléculaires intelligentes pourraient révolutionner la chimie
    en éliminant 90% des déchets industriels tout en créant des médicaments sur-mesure.
  score_impact: transformatif
  solutions_existantes: Aujourd'hui, les réactions chimiques sont contrôlées par la
    température, la pression et les catalyseurs traditionnels, mais avec une précision
    limitée qui génère beaucoup de déchets et de sous-produits indésirables. Cette
    approche offrirait un contrôle quasi-parfait des réactions, comme passer d'un
    marteau à un scalpel de chirurgien.
  taille_marche_estimee: Centaines de milliards d'euros - l'industrie chimique mondiale
    représente plus de 3000 milliards d'euros annuels
  vulgarisation: Imaginez des réactions chimiques qui se déroulent dans des "cages
    moléculaires" spécialement conçues, comme des moules à gâteau qui forcent les
    ingrédients à se mélanger dans le bon ordre. Ces cages permettent de contrôler
    précisément quels produits chimiques se forment, un peu comme un chef qui utilise
    des ustensiles spéciaux pour créer des plats parfaits à chaque fois. Cette technique
    pourrait rendre la fabrication de médicaments et de matériaux beaucoup plus précise
    et efficace.
