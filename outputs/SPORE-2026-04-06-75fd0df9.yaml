bridge:
  mechanism: Host-guest chemistry principles can create supramolecular environments
    that pre-organize organometallic substrates (like aryl halides) in specific orientations
    relative to metal centers, controlling which bonds undergo oxidative addition.
    The binding affinity and geometry within supramolecular hosts can be tuned to
    favor specific reaction pathways, similar to how enzymes use binding pockets to
    control selectivity. This represents a transfer of molecular recognition principles
    from supramolecular chemistry to control fundamental organometallic transformations.
  summary: Supramolecular host-guest binding dynamics can be used to control and predict
    the selectivity of organometallic oxidative addition reactions by pre-organizing
    substrates in specific geometries.
  type: methodological_transfer
