bridge:
  mechanism: CRISPR-Cas systems and other RNA-guided nucleases developed for mammalian
    cell editing can be adapted for precise genome modification in fungi, allowing
    targeted insertion/deletion of genes involved in secondary metabolite production,
    pathogenesis factors, and stress resistance. This methodological transfer could
    unlock fungal biotechnology applications previously limited by imprecise genetic
    tools, particularly for non-model fungi where traditional genetic approaches fail.
  summary: RNA-guided programmable nucleases from molecular biology could enable precision
    editing of fungal genomes to engineer novel antifungal resistance mechanisms and
    metabolic pathways.
  type: methodological_transfer
