  one_liner: Des champignons programmables pourraient révolutionner la production
    de médicaments et créer une nouvelle génération de vaccins vivants sans danger.
  score_impact: significatif
  solutions_existantes: Aujourd'hui, modifier génétiquement les champignons est très
    difficile et imprécis, limitant leur utilisation industrielle. On utilise principalement
    des méthodes chimiques coûteuses ou des champignons naturels peu performants.
    Cette approche permettrait une ingénierie précise et rapide.
  taille_marche_estimee: Dizaines de milliards d'euros - le marché des biotechnologies
    fongiques représente environ 15 milliards d'euros et celui des antifongiques 4
    milliards d'euros
  vulgarisation: Imaginez des ciseaux moléculaires ultra-précis (CRISPR) qui permettent
    de modifier les champignons comme on édite un texte sur ordinateur. On pourrait
    transformer des champignons toxiques en usines à médicaments, ou créer des vaccins
    vivants inoffensifs. C'est comme reprogrammer la nature pour qu'elle travaille
    pour nous.
