  domain_b:
    context_abstracts:
    - '[The Importance of Statistics in Medical Healthcare (2024)]

      Abstract: Statistical principles play a fundamental role in shaping the landscape
      of medical science by providing a structured framework for analyzing data, drawing
      conclusions, and making informed decisions in healthcare settings. In the realm
      of medical research, statistical principles are crucial for designing experiments,
      interpreting results, and ensuring the reliability and validity of findings.
      Key statistical concepts like hypothesis testing, confidence intervals, regression
      analysis, and survival analysis are extensively utilized in medical studies
      to assess the effectiveness of treatments, understand disease patterns, and
      evaluate healthcare interventions. These principles enable healthcare professionals
      to make evidence-based decisions, tailor treatments to individual patient needs,
      and continuously improve the quality of care provided to patients. The role
      of statistics in medical research starts at the planning stage of a clinical
      trial or laboratory experiment to establish the design and size of an experiment
      that will ensure a good prospect of detecting effects of clinical or scientific
      interest. Statistics is again used during the analysis of data (sample data)
      to make inferences valid in a wider population. In simple situations computation
      of simple quantities such as P-values, confidence intervals, standard deviations,
      standard errors or application of some standard parametric or nonparametric
      tests may suffice.'
    - '[Inferential Statistics for Evidence-Based Decision-Making in Non-Profit Organizations
      (2025)]

      Inferential statistics extend quantitative analysis beyond description, enabling
      non-profit organizations to generalize findings from samples, quantify uncertainty,
      and test hypotheses. This article synthesizes core elements of inferential practice—including
      populations and samples, sampling distributions, hypothesis testing, confidence
      intervals, effect sizes, and common procedures such as t-tests, chi-square tests,
      ANOVA, and regression. Emphasis is placed on assumptions, design choices, and
      the interpretation of p-values alongside interval estimates and standardized
      effects. Practical examples illustrate applications in program evaluation, equity
      assessment, comparative intervention analysis, and predictive planning. The
      discussion addresses common pitfalls, such as conflating statistical with practical
      significance, multiple testing inflation, and biased sampling, offering remedies
      like pre-specification, multiplicity corrections, robust estimators, and transparent
      reporting. By integrating rigorous inference with contextual judgment, non-profits
      can convert sample evidence into credible, actionable guidance for policy, planning,
      and program improvement.'
    - '[Statistics in R with Tidyverse (2024)]

      This comprehensive seminar introduces participants to key concepts and practices
      in statistical inference using R, covering topics such as exploratory data analysis,
      regression analysis, confidence intervals, hypothesis testing, and more based
      on data science principles. Attendees will gain hands-on experience, enhancing
      their ability to manage and analyze complex datasets and effectively communicate
      their research findings.'
