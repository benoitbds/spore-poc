bridge:
  mechanism: The core insight is that both biomedical systems and materials processing
    involve complex multi-physics phenomena governed by partial differential equations
    that are difficult to solve in real-time. PINNs, which have been successfully
    applied to biosolid mechanics, biofluid dynamics, and physiological modeling in
    biomedical engineering, can be directly transferred to materials processing where
    similar mathematical structures govern heat transfer, mass diffusion, and phase
    transformations. The key advantage is that PINNs can enforce physical laws (like
    conservation of mass/energy, thermodynamic constraints) while learning from sparse
    sensor data, making them ideal for real-time process control in casting, welding,
    and heat treatment where direct measurement of internal states is impossible but
    physics-based constraints are well-known.
  summary: Physics-informed neural networks (PINNs) from biomedical engineering can
    revolutionize materials processing by embedding metallurgical phase transformation
    physics into real-time process control systems.
  type: methodological_transfer
collision:
  distance_score: 0.6917334198951721
  domain_a:
    context_abstracts:
    - '[Physics-Informed Machine Learning in Biomedical Science and Engineering (arXiv:2510.05433,
      2025)]

      Physics-informed machine learning (PIML) is emerging as a potentially transformative
      paradigm for modeling complex biomedical systems by integrating parameterized
      physical laws with data-driven methods. Here, we review three main classes of
      PIML frameworks: physics-informed neural networks (PINNs), neural ordinary differential
      equations (NODEs), and neural operators (NOs), highlighting their growing role
      in biomedical science and engineering. We begin with PINNs, which embed governing
      equations into deep learning models and have been successfully applied to biosolid
      and biofluid mechanics, mechanobiology, and medical imaging among other areas.
      We then review NODEs, which offer continuous-time modeling, especially suited
      to dynamic physiological systems, pharmacokinetics, and cell signaling. Finally,
      we discuss deep NOs as powerful tools for learning mappings between function
      spaces, enabling efficient simulations across multiscale and spatially heterogeneous
      biological domains. Throughout, we emphasize applications where physical interpretability,
      data scarcity, or system complexity make conventional black-box learning insufficient.
      We conclude by identifying open challenges and future directions for advancing
      PIML in biomedical science and engineering, including issues of uncertainty
      quantification, generalization, and integration of PIML and large language models.'
    - '[Mining social media data for biomedical signals and health-related behavior
      (arXiv:2001.10285, 2020)]

      Social media data has been increasingly used to study biomedical and health-related
      phenomena. From cohort level discussions of a condition to planetary level analyses
      of sentiment, social media has provided scientists with unprecedented amounts
      of data to study human behavior and response associated with a variety of health
      conditions and medical treatments. Here we review recent work in mining social
      media for biomedical, epidemiological, and social phenomena information relevant
      to the multilevel complexity of human health. We pay particular attention to
      topics where social media data analysis has shown the most progress, including
      pharmacovigilance, sentiment analysis especially for mental health, and other
      areas. We also discuss a variety of innovative uses of social media data for
      health-related applications and important limitations in social media data access
      and use.'
    - '[Hardware Implementation of Deep Network Accelerators Towards Healthcare and
      Biomedical Applications (arXiv:2007.05657, 2020)]

      The advent of dedicated Deep Learning (DL) accelerators and neuromorphic processors
      has brought on new opportunities for applying both Deep and Spiking Neural Network
      (SNN) algorithms to healthcare and biomedical applications at the edge. This
      can facilitate the advancement of medical Internet of Things (IoT) systems and
      Point of Care (PoC) devices. In this paper, we provide a tutorial describing
      how various technologies including emerging memristive devices, Field Programmable
      Gate Arrays (FPGAs), and Complementary Metal Oxide Semiconductor (CMOS) can
      be used to develop efficient DL accelerators to solve a wide variety of diagnostic,
      pattern recognition, and signal processing problems in healthcare. Furthermore,
      we explore how spiking neuromorphic processors can complement their DL counterparts
      for processing biomedical signals. The tutorial is augmented with case studies
      of the vast literature on neural network and neuromorphic hardware as applied
      to the healthcare domain. We benchmark various hardware platforms by performing
      a sensor fusion signal processing task combining electromyography (EMG) signals
      with computer vision. Comparisons are made between dedicated neuromorphic processors
      and embedded AI accelerators in terms of inference latency and energy. Finally,
      we provide our analysis of the field and share a perspective on the advantages,
      disadvantages, challenges, and opportunities that various accelerators and neuromorphic
      processors introduce to healthcare and biomedical domains.'
