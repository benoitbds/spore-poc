bridge:
  summary: High-entropy alloys' configurational entropy and lattice distortion effects
    can be engineered to create optimal energy filtering at grain boundaries in thermoelectric
    materials, enhancing the Seebeck coefficient while maintaining electrical conductivity.
  mechanism: In high-entropy alloys, severe lattice distortion and sluggish diffusion
    create energy barriers that could be precisely tuned through entropy engineering.
    When applied to thermoelectric materials, these controlled distortions at grain
    boundaries would create energy-dependent scattering that preferentially filters
    low-energy charge carriers while allowing high-energy carriers to pass. The multi-principal-element
    approach from HEAs could create compositionally graded interfaces in thermoelectrics
    where the local configurational entropy varies spatially, establishing energy
    barriers of specific heights. This differs from random nanostructuring by providing
    systematic control over barrier height distribution through entropy calculations,
    potentially achieving the theoretical benefits of energy filtering without the
    electrical conductivity penalties observed in current nanostructured thermoelectrics.
  type: causal_transfer
