predictions:
- statement: Thermoelectric materials with HEA-inspired compositionally graded grain
    boundaries will show enhanced Seebeck coefficients without proportional drops
    in electrical conductivity
  metric: Power factor (σS²) improvement ratio compared to homogeneous composition
  expected_range: 1.5-3x improvement over baseline
  differs_from_consensus: true
- statement: The optimal grain boundary composition for energy filtering can be predicted
    from configurational entropy calculations rather than empirical optimization
  metric: Correlation coefficient between calculated configurational entropy and measured
    Seebeck enhancement
  expected_range: R² > 0.7
  differs_from_consensus: true
- statement: Maximum cooling performance will scale with power factor improvement
    rather than zT in these entropy-engineered materials
  metric: Ratio of cooling performance improvement to zT improvement
  expected_range: '> 1.0'
  differs_from_consensus: true
kill_condition: If entropy-engineered grain boundaries show the same electrical conductivity
  degradation patterns as randomly nanostructured materials with no correlation to
  configurational entropy calculations
