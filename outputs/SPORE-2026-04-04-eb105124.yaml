impact_analysis:
  vulgarisation: Imaginez des matériaux qui convertissent la chaleur en électricité
    comme un panneau solaire convertit la lumière. Ces chercheurs veulent créer des
    alliages spéciaux avec des 'filtres' microscopiques qui laissent passer seulement
    les électrons les plus énergétiques, comme un filtre à café qui ne garde que le
    meilleur. Cela pourrait créer des générateurs électriques beaucoup plus efficaces
    à partir de chaleur perdue.
  impact_concret: Des voitures qui rechargent leurs batteries avec la chaleur du moteur,
    des usines qui récupèrent massivement leur chaleur perdue pour produire de l'électricité,
    des capteurs autonomes alimentés par la chaleur corporelle, et des systèmes de
    refroidissement ultra-efficaces sans compresseur pour la climatisation et la réfrigération.
  industries_impactees:
  - Automobile
  - Industrie manufacturière
  - Electronique
  - Energie
  - Climatisation et réfrigération
  - Aéronautique
  - Dispositifs médicaux
  taille_marche_estimee: Plusieurs dizaines de milliards d'euros - le marché de la
    récupération d'énergie et des systèmes thermoélectriques représente un potentiel
    énorme dans l'industrie et les transports
  horizon_temporel: Moyen terme (3-10 ans)
  solutions_existantes: Les matériaux thermoélectriques actuels sont peu efficaces
    et perdent beaucoup d'électricité en interne. Les solutions de récupération de
    chaleur restent marginales car trop coûteuses. Cette approche promet d'améliorer
    l'efficacité de 50% à 300% en contrôlant précisément la structure interne des
    matériaux.
  score_impact: transformatif
  one_liner: Des matériaux intelligents qui transforment la chaleur perdue en électricité
    pourraient révolutionner l'efficacité énergétique de tous nos appareils.
