    context_abstracts:
    - '[Multi-Compartmental Biomaterial Scaffolds for Patterning Neural Tissue Organoids
      in Models of Neurodevelopment and Tissue Regeneration (arXiv:1610.02543, 2016)]

      Biomaterials are becoming an essential tool in the study and application of
      stem cell research. Various types of biomaterials enable three-dimensional (3D)
      culture of stem cells, and, more recently, also enable high-resolution patterning
      and organization of multicellular architectures. Biomaterials also hold potential
      to provide many additional advantages over cell transplants alone in regenerative
      medicine. This paper describes novel designs for functionalized biomaterial
      constructs that guide tissue development to targeted regional identities and
      structures. Such designs comprise compartmentalized regions in the biomaterial
      structure that are functionalized with molecular factors that form concentration
      gradients through the construct and guide stem cell development, axis patterning,
      and tissue architecture, including rostral/caudal, ventral/dorsal, or medial/lateral
      identities of the central nervous system. The ability to recapitulate innate
      developmental processes in a 3D environment and under specific controlled conditions
      has vital application to advanced models of neurodevelopment and for repair
      of specific sites of damaged or diseased neural tissue.'
    - '[Real-Time Maps of Fluid Flow Fields in Porous Biomaterials (arXiv:1301.2823,
      2013)]

      Mechanical forces such as fluid shear have been shown to enhance cell growth
      and differentiation, but knowledge of their mechanistic effect on cells is limited
      because the local flow patterns and associated metrics are not precisely known.
      Here we present real-time, noninvasive measures of local hydrodynamics in 3D
      biomaterials based on nuclear magnetic resonance. Microflow maps were further
      used to derive pressure, shear and fluid permeability fields. Finally, remodeling
      of collagen gels in response to precise fluid flow parameters was correlated
      with structural changes. It is anticipated that accurate flow maps within 3D
      matrices will be a critical step towards understanding cell behavior in response
      to controlled flow dynamics.'
    - '[Biomaterials: A trendy source to engineer functional entities -- An overview
      (arXiv:1803.05972, 2018)]

      The biomaterials exploitation in a sophisticated manner can provide extensive
      opportunities for experimentation in the field of interdisciplinary and multidisciplinary
      scientific research. Owing to the unique features of this trendy area, research
      scientists have been directed/redirected their interests in bio-based biomaterials
      for targeted applications in different sectors of the modern world. The present
      manuscript highlights the novel perspectives of biomaterials as a trendy source
      to engineer functional entities in numerous geometries for pharmaceuticals,
      cosmeceuticals, nutraceuticals, and other biotechnological or biomedical applications.'
