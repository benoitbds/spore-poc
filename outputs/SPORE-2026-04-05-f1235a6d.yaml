bridge:
  mechanism: The mathematical framework from pollinator adaptation research models
    how preferences dynamically shift based on resource availability and competition,
    creating emergent specialization patterns. This same algorithmic structure can
    be applied to sequence alignment where 'pollinator preferences' become 'alignment
    scoring preferences' that adapt based on local sequence composition, evolutionary
    distance, and alignment quality. Just as pollinators develop context-dependent
    preferences that reduce niche overlap and improve coexistence, alignment algorithms
    could develop context-dependent scoring that reduces false homology detection
    and improves phylogenetic resolution.
  summary: Adaptive pollinator preference algorithms can be transferred to bioinformatics
    sequence alignment problems to enable dynamic scoring matrices that adapt based
    on local sequence context and phylogenetic relationships.
  type: methodological_transfer
collision:
  distance_score: 0.6223135590553284
  domain_a:
    context_abstracts:
    - '[Competition, trait-mediated facilitation, and the structure of plant-pollinator
      communities (arXiv:1712.06846, 2017)]

      In plant-pollinator communities many pollinators are potential generalists and
      their preferences for certain plants can change quickly in response to changes
      in plant and pollinator densities. These changes in preferences affect coexistence
      within pollinator guilds as well as within plant guilds. Using a mathematical
      model, we study how adaptations of pollinator preferences influence population
      dynamics of a two-plant-two-pollinator community interaction module. Adaptation
      leads to coexistence between generalist and specialist pollinators, and produces
      complex plant population dynamics, involving alternative stable states and discrete
      transitions in the plant community. Pollinator adaptation also leads to plant-plant
      apparent facilitation that is mediated by changes in pollinator preferences.
      We show that adaptive pollinator behavior reduces niche overlap and leads to
      coexistence by specialization on different plants. Thus, this article documents
      how adaptive pollinator preferences for plants change the structure and coexistence
      of plant-pollinator communities.'
    - '[A biomarker based on gene expression indicates plant water status in controlled
      and natural environments (arXiv:1310.2542, 2013)]

      Plant or soil water status are required in many scientific fields to understand
      plant responses to drought. Because the transcriptomic response to abiotic conditions,
      such as water deficit, reflects plant water status, genomic tools could be used
      to develop a new type of molecular biomarker. Using the sunflower (Helianthus
      annuus L.) as a model species to study the transcriptomic response to water
      deficit both in greenhouse and field conditions, we specifically identified
      three genes that showed an expression pattern highly correlated to plant water
      status as estimated by the pre-dawn leaf water potential, fraction of transpirable
      soil water, soil water content or fraction of total soil water in controlled
      conditions. We developed a generalized linear model to estimate these classical
      water status indicators from the expression levels of the three selected genes
      under controlled conditions. This estimation was independent of the four tested
      genotypes and the stage (pre- or post-flowering) of the plant. We further validated
      this gene expression biomarker under field conditions for four genotypes in
      three different trials, over a large range of water status, and we were able
      to correct their expression values for a large diurnal sampling period.'
    - '[Unsupervised Domain Adaptation For Plant Organ Counting (arXiv:2009.01081,
      2020)]

      Supervised learning is often used to count objects in images, but for counting
      small, densely located objects, the required image annotations are burdensome
      to collect. Counting plant organs for image-based plant phenotyping falls within
      this category. Object counting in plant images is further challenged by having
      plant image datasets with significant domain shift due to different experimental
      conditions, e.g. applying an annotated dataset of indoor plant images for use
      on outdoor images, or on a different plant species. In this paper, we propose
      a domain-adversarial learning approach for domain adaptation of density map
      estimation for the purposes of object counting. The approach does not assume
      perfectly aligned distributions between the source and target datasets, which
      makes it more broadly applicable within general object counting and plant organ
      counting tasks. Evaluation on two diverse object counting tasks (wheat spikelets,
      leaves) demonstrates consistent performance on the target datasets across different
      classes of domain shift: from indoor-to-outdoor images and from species-to-species
      adaptation.'
