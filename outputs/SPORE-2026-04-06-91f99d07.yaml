  horizon_temporel: Moyen terme (3-10 ans)
  impact_concret: Des médicaments anticancer plus efficaces grâce à des nanoparticules
    parfaitement uniformes qui ciblent précisément les tumeurs. Des écrans d'ordinateur
    et smartphones avec des couleurs plus vives et une consommation réduite grâce
    à des nanocristaux optimisés. Des panneaux solaires plus performants avec des
    cellules photovoltaïques de nouvelle génération. Des cosmétiques et crèmes solaires
    avec une protection renforcée grâce à des nanoparticules mieux contrôlées.
  industries_impactees:
  - Pharmaceutique
  - Électronique
  - Énergie solaire
  - Cosmétiques
  - Matériaux avancés
  - Catalyse industrielle
  one_liner: Des nanoparticules fabriquées avec la précision d'une montre suisse pourraient
    révolutionner les médicaments anticancer et multiplier par deux l'efficacité des
    panneaux solaires.
  score_impact: significatif
  solutions_existantes: Aujourd'hui, les nanoparticules sont fabriquées en mélangeant
    les composants dans de grands réacteurs, ce qui donne des résultats variables
    et imprévisibles, comme mélanger de la peinture à la main. Cette nouvelle méthode
    permettrait un contrôle industriel précis, reproductible et automatisable, réduisant
    les défauts et améliorant les performances finales.
  taille_marche_estimee: Plusieurs centaines de milliards d'euros - le marché des
    nanomatériaux représente déjà 50+ milliards et croît de 15% par an
  vulgarisation: Imaginez fabriquer des nanoparticules comme sur une chaîne de montage
    ultra-précise, où chaque étape est minutée à la milliseconde. Au lieu de mélanger
    tous les ingrédients d'un coup dans un grand récipient (méthode actuelle), on
    les fait circuler dans de minuscules tubes où on contrôle exactement quand et
    comment ils se rencontrent. C'est comme passer de la cuisine de grand-mère à une
    usine robotisée pour assembler des briques de Lego de taille atomique.
