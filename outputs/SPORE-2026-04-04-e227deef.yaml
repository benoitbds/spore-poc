    context_abstracts:
    - '[Direct creation of micro-domains with positive and negative surface potential
      on hydroxyapatite coatings (arXiv:1103.4393, 2011)]

      A method for the direct patterning of electrostatic potential at the surface
      of hydroxyapatite is presented here. Micro-domains of surface potential have
      been created on hydroxyapatite coatings by a 20 keV focused electron beam with
      minimal alterations of surface chemistry. The success of such approach has been
      confirmed by Kelvin Probe Force Microscopy measurements, which show that this
      method is capable of creating micron sized positive and negative local electrostatic
      potential. The shape and potential difference of these domains were found to
      depend on the dose of total injected charge from the electron beam as well as
      the speed with which such charge is injected.'
    - '[Mining social media data for biomedical signals and health-related behavior
      (arXiv:2001.10285, 2020)]

      Social media data has been increasingly used to study biomedical and health-related
      phenomena. From cohort level discussions of a condition to planetary level analyses
      of sentiment, social media has provided scientists with unprecedented amounts
      of data to study human behavior and response associated with a variety of health
      conditions and medical treatments. Here we review recent work in mining social
      media for biomedical, epidemiological, and social phenomena information relevant
      to the multilevel complexity of human health. We pay particular attention to
      topics where social media data analysis has shown the most progress, including
      pharmacovigilance, sentiment analysis especially for mental health, and other
      areas. We also discuss a variety of innovative uses of social media data for
      health-related applications and important limitations in social media data access
      and use.'
    - '[Localising In-Domain Adaptation of Transformer-Based Biomedical Language Models
      (arXiv:2212.10422, 2022)]

      In the era of digital healthcare, the huge volumes of textual information generated
      every day in hospitals constitute an essential but underused asset that could
      be exploited with task-specific, fine-tuned biomedical language representation
      models, improving patient care and management. For such specialized domains,
      previous research has shown that fine-tuning models stemming from broad-coverage
      checkpoints can largely benefit additional training rounds over large-scale
      in-domain resources. However, these resources are often unreachable for less-resourced
      languages like Italian, preventing local medical institutions to employ in-domain
      adaptation. In order to reduce this gap, our work investigates two accessible
      approaches to derive biomedical language models in languages other than English,
      taking Italian as a concrete use-case: one based on neural machine translation
      of English resources, favoring quantity over quality; the other based on a high-grade,
      narrow-scoped corpus natively written in Italian, thus preferring quality over
      quantity. Our study shows that data quantity is a harder constraint than data
      quality for biomedical adaptation, but the concatenation of high-quality data
      can improve model performance even when dealing with relatively size-limited
      corpora. The models published from our investigations have the potential to
      unlock important research opportunities for Italian hospitals and academia.
      Finally, the set of lessons learned from the study constitutes valuable insights
      towards a solution to build biomedical language models that are generalizable
      to other less-resourced languages and different domain settings.'
