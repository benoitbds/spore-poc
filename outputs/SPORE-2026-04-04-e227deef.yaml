    context_abstracts:
    - '[Under pressure: Hydrogel swelling in a granular medium (arXiv:2103.11476,
      2021)]

      Hydrogels hold promise in agriculture as reservoirs of water in dry soil, potentially
      alleviating the burden of irrigation. However, confinement in soil can markedly
      reduce the ability of hydrogels to absorb water and swell, limiting their widespread
      adoption. Unfortunately, the underlying reason remains unknown. By directly
      visualizing the swelling of hydrogels confined in three-dimensional granular
      media, we demonstrate that the extent of hydrogel swelling is determined by
      the competition between the force exerted by the hydrogel due to osmotic swelling
      and the confining force transmitted by the surrounding grains. Furthermore,
      the medium can itself be restructured by hydrogel swelling, as set by the balance
      between the osmotic swelling force, the confining force, and intergrain friction.
      Together, our results provide quantitative principles to predict how hydrogels
      behave in confinement, potentially improving their use in agriculture as well
      as informing other applications such as oil recovery, construction, mechanobiology,
      and filtration.'
    - '[Scaling laws to predict humidity-induced swelling and stiffness in hydrogels
      (arXiv:2109.13316, 2021)]

      From pasta to biological tissues to contact lenses, gel and gel-like materials
      inherently soften as they swell with water. In dry, low-relative-humidity environments,
      these materials stiffen as they de-swell with water. Here, we use semi-dilute
      polymer theory to develop a simple power-law relationship between hydrogel elastic
      modulus and swelling. From this relationship, we predict hydrogel stiffness
      or swelling at arbitrary relative humidities. Our close predictions of properties
      of hydrogels across three different polymer mesh families at varying crosslinking
      densities and relative humidities demonstrate the validity and generality of
      our understanding. This predictive capability enables more rapid material discovery
      and selection for hydrogel applications in varying humidity environments.'
    - '[Hyperelastic swelling of stiff hydrogels (arXiv:2401.04251, 2024)]

      Hydrogels are biphasic, swollen polymer networks where elastic deformation is
      coupled to nanoscale fluid flow. As a consequence, hydrogels can withstand large
      strains and exhibit nonlinear, hyperelastic properties. For low-modulus hydrogel
      and semiflexible biopolymer networks, previous studies have shown that these
      materials universally contract when sheared on timescales much longer than the
      poroelastic relaxation timescale. Using rheological and tribological measurements,
      we find that stiff polyacrylamide and polyacrylic acid hydrogels, with moduli
      of order ~10-100 kPa, exclusively swell (dilate) when sheared. The poroelastic
      relaxation process was examined using strain-controlled compression, indicating
      a volumetric diffusion constant of order 10^-9 m^2/s. Upon shearing, we observed
      an increase in normal stress that varied quadratically with shear strain, and
      persisted for hours. Moreover, we show that this dilatant behavior manifests
      as swelling during tribological sliding, imbibing the hydrogel with fluid. We
      suggest that this inherent, hyperelastic dilatancy is an important feature in
      all stiff hydrogels, and may explain rehydration and mechanical rejuvenation
      in biological tissues such as cartilage.'
