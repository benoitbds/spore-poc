predictions:
- statement: Perovskite solar cells deposited with controlled temperature gradients
    or pulsed deposition will show anisotropic carrier mobility with preferential
    transport directions
  metric: Ratio of carrier mobility parallel vs perpendicular to deposition gradient
    direction
  expected_range: 1.5-3.0x enhancement in preferred direction
  differs_from_consensus: true
- statement: Films deposited with intentional substrate surface patterning will exhibit
    quantum efficiency variations that correlate with the underlying growth-induced
    defect networks
  metric: Spatial correlation coefficient between local quantum efficiency and substrate
    pattern periodicity
  expected_range: 0.6-0.9 correlation coefficient
  differs_from_consensus: true
- statement: Post-irradiation regeneration rates will depend on the original deposition
    kinetics due to pre-existing defect network topology
  metric: Regeneration time constant as function of deposition rate
  expected_range: Power law relationship with exponent -0.3 to -0.7
  differs_from_consensus: true
