    context_abstracts:
    - '[Dynamic electrical behavior of halide perovskite based solar cells (arXiv:1606.00335,
      2016)]

      A dynamic electrical model is introduced to investigate the hysteretic effects
      in the I-V characteristics of perovskite based solar cells. By making a simple
      ansatz for the polarization relaxation, our model is able to reproduce qualitatively
      and quantitatively detailed features of measured I-V characteristics. Pre-poling
      effects are discussed, pointing out the differences between initially over-
      and under-polarized samples. In particular, the presence of the current over-shoot
      observed in the reverse characteristics is correlated with the solar cell pre-conditioning.
      Furthermore, the dynamic hysteresis is analyzed with respect to changing the
      bias scan rate, the obtained results being consistent with experimentally reported
      data: the hysteresis amplitude is maximum at intermediate scan rates, while
      at very slow and very fast ones it becomes negligible. The effects induced by
      different relaxation time scales are assessed. The proposed dynamic electrical
      model offers a comprehensive view of the solar cell operation, being a practical
      tool for future calibration of tentative microscopic descriptions.'
    - '[Radiation hardness and post irradiation regeneration behavior of GaInAsP solar
      cells (arXiv:2004.00308, 2020)]

      Recent developments have renewed the demand for solar cells with increased tolerance
      to radiation damage. To investigate the specific irradiation damage of 1 MeV
      electron irradiation in GaInAsP lattice matched to InP for varying In and P
      contents, a simulation based analysis is employed: by fitting the quantum efficiency
      and open-circuit voltage simultaneously before and after irradiation, the induced
      changes in lifetime are detected. Furthermore, the reduction of irradiation
      damage during regeneration under typical satellite operating conditions for
      GEO missions (60°C and AM0 illumination) is investigated. A clear decrease of
      the radiation damage is observed after post irradiation regeneration. This regeneration
      effect is stronger for increasing InP-fraction. It is demonstrated that the
      irradiation induced defect recombination coefficient for irradiation with 1
      MeV electrons after regeneration for 216 hours can be described with a linear
      function of InP-fraction between 1*10$^{-5}$ cm$^2$/s for GaAs and 7*10$^{-7}$
      cm$^2$/s for InP. The results show that GaInAsP is a promising material for
      radiation hard space solar cells.'
    - '[Materials Discovery of Stable and Nontoxic Halide Perovskite Materials for
      High-Efficiency Solar Cells (arXiv:1904.05690, 2019)]

      Two critical limitations of organic-inorganic lead halide perovskite materials
      for solar cells are their poor stability in humid environments and inclusion
      of toxic lead. In this study, high-throughput density functional theory (DFT)
      methods are used to computationally model and screen 1845 halide perovskites
      in search of new materials without these limitations that are promising for
      solar cell applications. This study focuses on finding materials that are comprised
      of nontoxic elements, stable in a humid operating environment, and have an optimal
      bandgap for one of single junction, tandem Si-perovskite, or quantum dot-based
      solar cells. Single junction materials are also screened on predicted single
      junction photovoltaic (PV) efficiencies exceeding 22.7%, which is the current
      highest reported PV efficiency for halide perovskites. Generally, these methods
      qualitatively reproduce the properties of known promising nontoxic halide perovskites
      that have either been experimentally evaluated or predicted from theory. From
      a set of 1845 materials, 15 materials pass all screening criteria for single
      junction cell applications, 13 of which have not been previously investigated,
      such as (CH3NH3)0.75Cs0.25SnI3, ((NH2)2CH)Ag0.5Sb0.5Br3, CsMn0.875Fe0.125I3,
      ((CH3)2NH2)Ag0.5Bi0.5I3, and ((NH2)2CH)0.5Rb0.5SnI3. These materials, together
      with others predicted in this study, may be promising candidate materials for
      stable, highly efficient, and non-toxic perovskite-based solar cells.'
