  from early-stage bubble distributions
- Measure stress intensity factors around helium bubble arrays in neutron-irradiated
  specimens using digital image correlation
- Correlate post-mortem fracture surface analysis with pre-fracture bubble microstructure
  in helium-implanted specimens
