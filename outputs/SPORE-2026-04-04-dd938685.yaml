predictions:
- statement: Helium bubble coalescence in nuclear materials should exhibit a geometric
    acceleration factor similar to microcrack coalescence in brittle fracture
  metric: Ratio of macroscale swelling rate to individual bubble growth rate
  expected_range: 2-10x acceleration factor when bubble density exceeds critical threshold
  differs_from_consensus: true
- statement: Critical helium bubble spacing should follow Griffith-like criterion
    based on local stress fields
  metric: Bubble spacing at onset of catastrophic coalescence
  expected_range: Scaling with sqrt(KIC/applied_stress) where KIC is material toughness
  differs_from_consensus: true
- statement: Post-irradiation fracture surfaces should show characteristic microcracking
    patterns predictable from helium bubble distributions
  metric: Correlation between pre-fracture bubble maps and post-fracture surface topology
  expected_range: R² > 0.7 correlation between bubble density maps and fracture surface
    roughness
  differs_from_consensus: true
kill_condition: If helium bubble coalescence shows no geometric acceleration effects
  and proceeds purely through individual bubble growth kinetics with linear scaling
next_steps:
