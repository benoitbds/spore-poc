    context_abstracts:
    - '[A Chemical Route to Graphene for Electronics and Spintronics Device Applications
      (arXiv:1409.5849, 2014)]

      The development of selective high precision chemical functionalization strategies
      for device fabrication, in conjunction with associated techniques for patterning
      graphene wafers with atomic accuracy would provide the necessary basis for a
      post-CMOS manufacturing technology. This requires a thorough understanding of
      the principles governing the reactivity and patterning of graphene at the sub-nanometer
      length scale. This article reviews our quest to delineate the principles of
      graphene chemistry - that is, the chemistry at the Dirac point and beyond, and
      the effect of covalent chemistry on the electronic structure, electrical transport
      and magnetic properties of this low-dimensional material in order to enable
      the scalable production of graphene-based devices for low- and high-end technology
      applications.'
    - '[First-principles design and subsequent synthesis of a material to search for
      the permanent electric dipole moment of the electron (arXiv:1002.0376, 2010)]

      We describe the first-principles design and subsequent synthesis of a new material
      with the specific functionalities required for a solid-state-based search for
      the permanent electric dipole moment of the electron. We show computationally
      that perovskite-structure europium barium titanate should exhibit the required
      large and pressure-dependent ferroelectric polarization, local magnetic moments,
      and absence of magnetic ordering even at liquid helium temperature. Subsequent
      synthesis and characterization of Eu$_{0.5}$Ba$_{0.5}$TiO$_3$ ceramics confirm
      the predicted desirable properties.'
    - '[Synthesis of titanate nanostructures using amorphous precursor material and
      their adsorption/photocatalytic properties (arXiv:1201.3644, 2012)]

      This paper reports on a new and swift hydrothermal chemical route to prepare
      titanate nanostructures (TNS) avoiding the use of crystalline TiO2 as starting
      material. The synthesis approach uses a commercial solution of TiCl3 as titanium
      source to prepare an amorphous precursor, circumventing the use of hazardous
      chemical compounds. The influence of the reaction temperature and dwell autoclave
      time on the structure and morphology of the synthesised materials was studied.
      Homogeneous titanate nanotubes with a high length/diameter aspect ratio were
      synthesised at 160^{\circ}C and 24 h. A band gap of 3.06\pm0.03 eV was determined
      for the TNS samples prepared in these experimental conditions. This value is
      red shifted by 0.14 eV compared to the band gap value usually reported for the
      TiO2 anatase. Moreover, such samples show better adsorption capacity and photocatalytic
      performance on the dye rhodamine 6G (R6G) photodegradation process than TiO2
      nanoparticles. A 98% reduction of the R6G concentration was achieved after 45
      minutes of irradiation of a 10 ppm dye aqueous solution and 1 g/L of TNS catalyst.'
