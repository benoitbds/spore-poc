    context_abstracts:
    - '[Functionalized CdTe Fluorescence Nanosensor for the Sensitive Detection of
      Water Borne Environmentally Hazardous Metal Ions (arXiv:2011.00062, 2020)]

      In this work, we have investigated the possibility of using COOH functionalized
      CdTe quantum dots (QDs) as fluorescent nanosensor for the detection of some
      environmentally hazardous metal ions ($\rm{Cr^{3+}}$, $\rm{Pb^{2+}}$, $\rm{Cu^{2+}}$,
      $\rm{Zn^{2+}}$ and $\rm{Co^{2+}}$) in aqueous phase. COOH-CdTe QDs are prepared
      in aqueous medium and characterized by UV-visible, photo luminescence and FTIR
      spectrometry. Optical response of CdTe nanosensor is observed to be time and
      temperature dependent. A strong "Turn-Off" fluorescence response of CdTe is
      observed in presence of all metals ions ($\rm{X^{n+}}$). The output of Stern
      volmer relation, graphical Job''s plot and FTIR data established the existence
      of strong 1:1 complexation ($\rm{X^{n+}: ^{-}OOC-CdTe)}$ between CdTe and metal
      ions. CdTe shows its efficient sensing ability for $\rm{Pb^{2+}}$, $\rm{Cr^{3+}}$
      and $\rm{Cu^{2+}}$ ions up to concentration $\rm{10^{-14}}$ M which was established
      by its low detection of limit (LOD)validation. Further, strong appearance of
      $\frac{F-F_{0}}{F_{0}}$ establishes the better sensing capability of CdTe QDs
      for $\rm{Cr^{3+}}$, $\rm{Pb^{2+}}$, $\rm{Cu^{2+}}$ ions which are far better
      than the existing fluorescent sensors available in industry. The proposed optical
      techniques and principal component analysis of sensing were successfully applied
      for testing of dissolved metal ions in real samples like: paint, river water,
      rain water etc which validates the applicability of COOH functionalized CdTe
      nanosensor as a effective successful optical sensor for water dissolved metal
      ions which are responsible for water pollution.'
    - '[Extraterrestrial Photochemistry: Principles and Applications (arXiv:2102.00094,
      2021)]

      Energetic processing of interstellar ice mantles and planetary atmospheres via
      photochemistry is a critical mechanism in the extraterrestrial synthesis of
      prebiotic molecules. Photochemistry is defined as chemical processes initiated
      by photon-induced electronic excitation, not involving ionization. In contrast,
      photons with energies above the ionization threshold initiate radiation chemistry
      (radiolysis). Vacuum-ultraviolet (6.2-12.4 eV) light may initiate photochemistry
      and radiation chemistry because the threshold for producing secondary electrons
      is lower in the condensed phase than in the gas phase. Approximately half of
      cosmic-ray induced photons incident on interstellar ices in star-forming regions
      initiate photochemistry while the rest initiate radiation chemistry. While experimental
      techniques such as velocity map imaging may be used to extract exquisite details
      about gas-phase photochemistry, such detailed information cannot be obtained
      for condensed-phase photochemistry, which involves greater complexity, including
      the production of excitons, excimers, and exciplexes. Because a primary objective
      of chemistry is to provide molecular-level mechanistic explanations for macroscopic
      phenomena, our ultimate goal in this book chapter is to critically evaluate
      our current understanding of the photochemistry that likely leads to the synthesis
      of extraterrestrial prebiotic molecules.'
    - '[Conformationally controlled photochemistry studied by trajectory surface hopping
      (arXiv:2208.14617, 2022)]

      This article reviews trajectory surface hopping methods to study conformationally
      controlled photochemistry. Besides focusing on the linear response time-dependent
      density functional theory surface hopping method, it reviews the generation
      of Boltzmann ensembles as starting conditions for photochemical dynamics, the
      calculation of electronic and vibronic absorption spectra, and the prediction
      of wavelength-dependent photochemical product quantum yields. Applications include
      organic photochemistry and vitamin D photochemistry.'
