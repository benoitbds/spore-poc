impact_analysis:
  horizon_temporel: Long terme (10-20 ans)
  impact_concret: Des tuiles de protection thermique qui ne cassent plus sur les navettes
    spatiales, des prothèses dentaires qui durent toute une vie, des composants d'avions
    qui ne nécessitent plus de maintenance préventive, des carrelages qui résistent
    aux chocs et tremblements de terre. Les objets du quotidien en céramique deviendraient
    quasi-indestructibles et beaucoup plus sûrs.
  industries_impactees:
  - Aérospatial
  - Automobile
  - Médical et dentaire
  - Construction
  - Électronique
  - Défense
  - Énergie
  one_liner: Des céramiques qui se réparent toutes seules pourraient révolutionner
    la sécurité aéronautique et spatiale en éliminant les pannes catastrophiques.
  score_impact: transformatif
  solutions_existantes: Actuellement, on renforce les céramiques avec des fibres,
    on fait des traitements de surface, ou on accepte qu'elles cassent et on les remplace
    régulièrement. Cette approche permettrait une auto-réparation en temps réel, éliminant
    le besoin de maintenance et les pannes catastrophiques.
  taille_marche_estimee: Centaines de milliards - le marché global des céramiques
    techniques représente 130 milliards de dollars, avec un potentiel de transformation
    majeure
  vulgarisation: Imaginez des objets en céramique qui se réparent automatiquement
    quand ils se fissurent, comme une peau qui cicatrise. Les chercheurs veulent intégrer
    des nano-matériaux spéciaux qui bougent quand ils détectent une fissure, créant
    une force qui l'empêche de grandir. C'est comme avoir des micro-muscles qui se
    contractent pour refermer une plaie.
kill_condition: If domain wall migration barriers exceed 1 eV in ceramic-constrained
  ferroelectric phases, making them uncompetitive with crack propagation kinetics
next_steps:
- Synthesize Al2O3-GeS nanocomposites with controlled ferroelectric volume fractions
  using solution processing
- Perform in-situ piezoresponse force microscopy during controlled crack propagation
  experiments
- Map domain wall density evolution around propagating cracks under applied electric
  fields
