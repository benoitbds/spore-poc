  domain_b:
    context_abstracts:
    - '[Polarization switching induced by domain wall sliding in two-dimensional ferroelectric
      monochalcogenides (arXiv:2204.12209, 2022)]

      The ability to switch between distinct states of polarization comprises the
      defining property of ferroelectrics. However, the microscopic mechanism responsible
      for switching is not well understood and theoretical estimates based on coherent
      monodomain switching typically overestimate experimentally determined coercive
      fields by orders of magnitude. In this work we present a detailed first principles
      characterization of domain walls (DWs) in two-dimensional ferroelectric GeS,
      GeSe, SnS and SnSe. In particular, we calculate the formation energies and migration
      barriers for 180 and 90 DWs, and then derive a general expression for the coercive
      field assuming that polarization switching is mediated by DW migration. We apply
      our approach to the materials studied and obtain good agreement with experimental
      coercive fields. The calculated coercive fields are up to two orders of magnitude
      smaller than those predicted from coherent monodomain switching in GeSe, SnS
      and SnSe. Finally, we study the optical properties of the compounds and find
      that the presence of 180 DWs leads to a significant red shift of the absorption
      spectrum, implying that the density of DWs may be determined by means of simple
      optical probes.'
    - '[Intrinsic inverse band gap versus polarization relation in ferroelectric materials
      (arXiv:2411.03462, 2024)]

      Ferroelectric materials have promising applications in solar-energy conversion
      and electro-optic devices. The internal gradient fields produced by the macroscopic
      polarization may improve electronic and transport semiconducting properties.
      However, ferroelectrics tend to display relatively large band gaps and hence
      low solar-energy conversion efficiencies. In this work, we explore materials
      with an intrinsic inverse relation between band gap and polarization in a single
      ferroelectric phase. Ferroelectrics with an inverse band gap versus polarization
      relation are characterized by low density of states contribution at the conduction
      states and negligible orbital hybridization at the valence states. We use high-throughput
      and first principles methods to find 15 ferroelectric materials with an inverse
      band gap versus polarization relation in the Materials Project database. Our
      work provides a new pathway to design small-band gap large-polarization ferroelectrics,
      by simultaneously tailoring the band gap and polarization of ferroelectrics
      with an inverse relation through an external tuning parameter.'
    - '[Inducing Spontaneous Electric Polarizations in Double Perovskite Iodide Superlattices
      for New Ferroelectric Photovoltaic Materials (arXiv:1804.06685, 2018)]

      In this work, we use density functional theory calculations to demonstrate how
      spontaneous electric polarizations can be induced \textit{via} a hybrid improper
      ferroelectric mechanism in iodide perovskites, a family well-known to display
      solar-optimal band gaps, to create new materials for photoferroic applications.
      We first assemble three chemically distinct ($A$$A^{\prime}$)($B$$B^{\prime}$)I$_6$
      double perovskites using centrosymmetric $AB$I$_3$ perovskite iodides (where
      $A$ = Cs, Rb, K and $B$ = Sn, Ge) as building units. In each superlattice, we
      investigate the effects of three types of $A$- and $B$-site cation ordering
      schemes and three different $B$I$_6$ octahedral rotation patterns. Out of these
      27 combinations, we find that 15 produce polar space groups and display spontaneous
      electric polarizations ranging from 0.26 to 23.33 $μ$C/cm$^2$. Furthermore,
      we find that a layered $A$-site/rock salt $B$-site ordering, in the presence
      of an $a^0a^0c^+$ rotation pattern, produces a chiral "vortex-like" $A$-site
      displacement pattern. We then investigate the effect of epitaxial strain on
      one of these systems, (CsRb)(SnGe)I$_6$, in layered and rock salt ordered configurations.
      In both phases, we find strong competition between the cation ordering schemes
      as well as an enhancement of the spontaneous polarization magnitude under tensile
      strain. Finally, using advanced functionals, we demonstrate that these compounds
      display low band gaps ranging from 0.2 to 1.3 eV. These results demonstrate
      that cation ordering and epitaxial strain are powerful ways to induce and control
      new functionalities in technologically-useful families of materials.'
