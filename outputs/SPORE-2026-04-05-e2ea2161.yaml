  domain_a:
    context_abstracts:
    - '[Successful production of Solution Blow Spun YBCO+Ag complex ceramics (arXiv:2004.07287,
      2020)]

      YBCO fabrics composed of nanowires, produced by solution blow spinning (SBS)
      are so brittle that the Lorentz force produced by induced currents can be strong
      enough to damage them. On the other hand, it is known that silver addition improves
      the mechanical and flux pinning properties of ceramic superconductors. Thus,
      in this work, we show how we successfully obtained a polymeric precursor solution
      containing YBCO$+$Ag salts, which can be spun by the SBS route to produce ceramic
      samples. Yttrium, barium, copper, and silver metal acetates, and polyvinylpyrrolidone
      (PVP) (in a ratio of 5:1wt [PVP:acetates]) were dissolved in a solution with
      61.5 wt\% of methanol, 12 wt\% of propionic acid, and 26.5 wt\% of ammonium
      hydroxide, together with 6 wt\% of PVP in solution. Three different amounts
      of silver (10 wt\%, 20 wt\%, and 30 wt\%) were used in YBa$_2$Cu$_3$O$_{7-x}$.
      The TGA characterizations revealed a lowering of crystallization and partial
      melting temperatures by about \SI{30}{\celsius}. SEM images show that after
      burning out the polymer, a fabric composed of nanowires of diameters up to \SI{380}{\nano
      \metre} is produced. However, after the sintering process at \SI{925}{\celsius}
      for \SI{1}{\hour}, the nanowires shrink into a porous-like sample.'
    - '[Influence of CaO and SiO2 additives on the sintering behavior of Cr,Ca:YAG
      ceramics prepared by solid-state reaction sintering (arXiv:2601.06721, 2026)]

      Optical ceramics of yttrium aluminum garnet (Y3-xCaxAl4.95Cr0.05O12) doped with
      0.1 at.% of chromium ions and 0.5, 0.8, and 1.2 at.% of calcium ions were prepared
      by reactive sintering in vacuum at 1750 degrees C. The influence of SiO2 and
      CaO sintering aids on the optical properties and microstructure of Cr,Ca:YAG
      ceramics was investigated. A decrease in CaO concentration led to a reduction
      of Cr,Ca:YAG transparency from 81 to 0 percent at 1064 nm; moreover, ceramics
      with lower CaO content exhibited abnormal grains and high porosity. These features
      were attributed to interactions between silica and calcium oxide during vacuum
      sintering. Two mechanisms are proposed to explain the effect of CaO and SiO2
      on the formation of Ca,Cr:YAG ceramics. The first involves the formation of
      a liquid phase due to the CaO-SiO2 interaction during the heating stage, resulting
      in abnormal grain growth. The second mechanism is the mutual consumption of
      Si4+ and Ca2+ ions during the isothermal stage of sintering, which leads to
      a decrease in Cr4+ concentration. Both mechanisms negatively affect the optical
      and laser properties of the ceramics.'
    - '[Analytical modelling of thermal residual stresses and optimal design of ZrO2/(ZrO2+Ni)
      sandwich ceramics (arXiv:1907.09259, 2019)]

      The joining of ceramics with metals have been extensively used in applications
      requiring high strength and excellent heat insulation. However, evaluating the
      residual stress generated inevitably due to the mismatch in coefficients of
      thermal expansion of ceramic and metal is challenging, which is very important
      for fabrication and characterization of layered inhomogeneous material. A simplified
      analytical model considering the overall deformation compatibility is established
      to compute the interlaminar residual stresses of the ZrO2/(ZrO2+Ni) sandwich
      ceramics, which agrees well with the results obtained by the commercial finite
      element package. The effects of the thickness ratio of the transitional layer
      to the middle layer, and the number of transitional layers on the properties
      of the ZrO2/(ZrO2+Ni) sandwich ceramics are researched to obtain the optimal
      structure.'
