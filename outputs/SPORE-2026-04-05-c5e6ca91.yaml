  horizon_temporel: Moyen terme (3-10 ans)
  impact_concret: Des moteurs d'avion plus fiables nécessitant moins de maintenance,
    des vols moins chers et plus sûrs, une réduction des émissions grâce à des moteurs
    fonctionnant à plus haute température avec une meilleure efficacité énergétique.
    Les compagnies aériennes économiseraient des millions en coûts de maintenance
    et les passagers bénéficieraient de tarifs réduits et de moins d'annulations pour
    problèmes techniques.
  industries_impactees:
  - Aéronautique
  - Aérospatial
  - Turbines à gaz
  - Production d'électricité
  - Défense
  one_liner: Des revêtements de moteur d'avion inspirés des verres métalliques pourraient
    tripler leur durée de vie et révolutionner la maintenance aéronautique.
  score_impact: significatif
  solutions_existantes: Actuellement, on utilise des revêtements céramiques multicouches
    avec des interfaces nettes entre matériaux. Ces revêtements durent environ 1000
    cycles thermiques avant de se décoller. La nouvelle approche promet 2-3 fois plus
    de durabilité en créant des transitions graduelles qui répartissent mieux les
    contraintes, comme dans les verres métalliques.
  taille_marche_estimee: Marché des revêtements thermiques estimé à 15-20 milliards
    de dollars, avec un potentiel d'économies de maintenance de plusieurs milliards
    supplémentaires pour l'industrie aéronautique
  vulgarisation: Les moteurs d'avion sont protégés de la chaleur extrême par des revêtements
    spéciaux qui s'écaillent après quelques centaines de cycles de chauffe-refroidissement.
    Des chercheurs veulent s'inspirer de la structure des verres métalliques, qui
    restent stables sans cristalliser, pour créer des revêtements plus durables. L'idée
    est de copier l'arrangement atomique de ces verres pour éviter les contraintes
    qui font se décoller les revêtements actuels.
