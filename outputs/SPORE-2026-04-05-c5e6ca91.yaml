    context_abstracts:
    - '[Theoretical Prediction and Experimental Validation of the Glass-Forming Ability
      and Magnetic Properties of Fe-Si-B Metallic Glasses from Atomic Structures (2022)]

      Developing new soft magnetic amorphous alloys with a low cost and high saturation
      magnetization (Bs) in a simple alloy system has attracted substantial attention
      for industrialization and commercialization. Herein, the glass-forming ability
      (GFA), thermodynamic properties, soft magnetic properties, and atomic structures
      of Fe80+xSi5−xB15 (x = 0–4) amorphous soft magnetic alloys were investigated
      by ab initio molecular dynamics (AIMD) simulations and experiments. The pair
      distribution function (PDF), Voronoi polyhedron (VP), coordination number (CN),
      and chemical short- range order (CSRO) were analyzed based on the AIMD simulations
      for elucidating the correlations between the atomic structures with the glass-forming
      ability and magnetic properties. For the studied compositions, the Fe82Si3B15
      amorphous alloy was found to exhibit the strongest solute–solute avoidance effect,
      the longest Fe-Fe bond, a relatively high partial CN for the Fe-Fe pair, and
      the most pronounced tendency to form more stable clusters. The simulation results
      indicated that Fe82Si3B15 was the optimum composition balancing the saturation
      magnetization and the GFA. This prediction was confirmed by experimental observations.
      The presented work provides a reference for synthesizing new Fe-Si-B magnetic
      amorphous alloys.'
    - '[Impact of atomic packing and electronic structure on icosahedral short-range
      order and glass-forming ability of Zr–Cu metallic glasses (2024)]

      ABSTRACT Chemical and topological short-range ordering are important for glass
      formation in metallic alloys. Yet, it remains little understood from the viewpoint
      of the electronic bonding among the constituent elements of the alloys. In this
      work, we study CuxZr100−x, (46 ≤ x ≤ 70) metallic glasses, where the atomic
      packing efficiency and the electronic structure of the full icosahedra, the
      key short-range order structures, have been investigated in detail. To capture
      a realistic picture of the electronic bonding in the icosahedra in the as-quenched
      metastable state, DFT study of the electronic structure of the icosahedra extracted
      from classical molecular dynamics simulation is carried out. Results for the
      CunZr13−n, (4 ≤ n ≤ 9) clusters reveal that Cu6Zr7, Cu7Zr6 and Cu8Zr5 are the
      most abundant, electronically stable in Cu50Zr50, Cu58Zr42 and Cu64Zr36, respectively.
      These three clusters also exhibit pseudo-gap in the density of states at the
      Fermi level – a feature linked with glass-forming ability according to the nearly-free
      electron approach. The partial density of states demonstrates the effect of
      small changes in the stoichiometry of the clusters on the s, p and d states
      of Cu and Zr in Cu–Cu and Cu–Zr bonding and hence, the stability of the clusters.'
    - '[Microstructure of metallic glasses at mesoscopic scale: spatial heterogeneity
      in correlating atomic configurations with macroscopic properties (2025)]

      The atomic arrangement of metallic glasses lacks long-range periodicity, displaying
      structural characteristics of an amorphous state. Their unique structural features
      lead to research methods that differ from traditional metallic crystalline materials,
      focusing mainly on two scales: one class at the macroscopic scale investigating
      glass-forming ability and mechanical behavior through alloy design, thermodynamic
      parameters, and other means; the other class at the atomic scale studying medium-
      to short-range orders of metallic glass through computational simulations and
      diffraction techniques. There is over a seven-order magnitude difference between
      the scales of these two methods, making it difficult to establish a direct quantitative
      relationship between the two, necessitating a structural feature that can connect
      atomic configurations with macroscopic properties at a mesoscopic scale. With
      the advancement of characterization techniques for amorphous structures, metallic
      glasses have been found to exhibit nanoscale and microscale spatial heterogeneity
      above medium- and short-range orders, with their scale falling between macroscopic
      and atomic scales. This article will introduce experimental characterization
      methods for spatial heterogeneity, focus on the electron microscopic characterization
      methods of spatial heterogeneity and local atomic orders, and discuss their
      intrinsic correlations with macroscopic properties such as β-relaxation behavior,
      mechanical behavior, thermodynamic stability, and glass-forming ability. As
      a structural feature of metallic glasses at the mesoscopic scale, spatial heterogeneity
      can serve as a link connecting the atomic medium- to short-range orders with
      macroscopic properties.'
    - '[A Machine Learning Framework for Predicting Glass-Forming Ability in Ternary
      Alloy Systems (arXiv:2512.05895, 2025)]

      Predicting the glass-forming ability (GFA) of chemical compositions remains
      a fundamental challenge in materials science, especially for oxide glasses with
      broad compositional diversity. Traditional empirical and thermodynamic approaches
      often fail to capture the complex, nonlinear factors governing vitrification.
      In this study, we applied two ensemble machine learning algorithms-Random Forest
      (RF) and Extreme Gradient Boosting (XGB)-to the glass_ternary_hipt dataset to
      predict the GFA of ternary oxide glasses directly from composition-derived descriptors.
      Both models achieved excellent predictive accuracy (R^2 > 0.92, MAE < 0.04),
      confirming that GFA is learnable from compositional features alone. Feature
      importance analysis revealed that electronegativity variance, atomic size mismatch,
      and valence electron descriptors are the most influential factors, while cohesive
      energy and ionic radius provided secondary contributions. These chemically interpretable
      features align with established theories of glass formation, thereby bridging
      predictive performance with physical understanding. The novelty of this work
      lies in systematically extending ML-based predictive modeling to ternary oxide
      glasses, a class less studied compared to metallic and binary systems. Our results
      demonstrate that ensemble learning not only enables accurate GFA prediction
      but also provides actionable insights for designing new glass compositions with
      enhanced stability.'
    - '[What can spin glass theory and analogies tell us about ferroic glasses? (arXiv:1710.04289,
      2017)]

      As well as several different kinds of periodically ordered ferroic phases, there
      are now recognized several different examples of ferroic glassiness, although
      not always described as such and in material fields of study that have mostly
      been developed separately. In this chapter an attempt is made to indicate common
      conceptual origins and features, observed or anticipated. Throughout, this aim
      is pursued through the use of simple models, in an attempt to determine probable
      fundamental origins within a larger picture of greater complication, and analogies
      between systems in different areas, both experimental and theoretical, in the
      light of significant progress in spin glass understanding.'
    - '[Mechanical Behaviour of Glasses and Amorphous Materials (arXiv:2108.08568,
      2021)]

      A wide range of materials can exist in microscopically disordered solid forms,
      referred to as amorphous solids or glasses. Such materials -- oxide glasses
      and metallic glasses, to polymer glasses, and soft solids such as colloidal
      glasses, emulsions and granular packings -- are useful as structural materials
      in a variety of contexts. Their deformation and flow behaviour is relevant for
      many others. Apart from fundamental questions associated with the formation
      of these solids, comprehending their mechanical behaviour is thus of interest,
      and of significance for their use as materials. In particular, the nature of
      plasticity and yielding behaviour in amorphous solids has been actively investigated.
      Different amorphous solids exhibit behaviour that is apparently diverse and
      qualitatively different from those of crystalline materials. A goal of recent
      investigations has been to comprehend the unifying characteristics of amorphous
      plasticity and to understand the apparent differences among them. We summarise
      some of the recent progress in this direction. We focus on insights obtained
      from computer simulation studies, and in particular those employing oscillatory
      shear deformation of model glasses.'
