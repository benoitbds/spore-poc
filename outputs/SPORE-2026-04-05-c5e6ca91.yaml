      ms QCW laser drilling of angular holes over TBC coated superalloys and provides
      a pragmatic solution to the issue of TBC delamination. In addition to...'
    - '[Hot Corrosion Behavior of Plasma-Sprayed Gd2Zr2O7/YSZ Functionally Graded
      Thermal Barrier Coatings (2024)]

      The development of advanced thermal barrier coating (TBC) materials with better
      hot corrosion resistance, phase stability, and residual stresses is an emerging
      research area in the aerospace industry. In the present study, four kinds of
      TBCs, namely, single-layer yttria-stabilized zirconia (YSZ), single-layer gadolinium
      zirconate (GZ), bilayer gadolinium zirconate/yttria-stabilized zirconia (YSZ/GZ),
      and a multilayer functionally graded coating (FGC) of YSZ and GZ, were deposited
      on NiCrAlY bond-coated nickel-based superalloy (Inconel 718) substrates using
      the atmospheric plasma spray technique. The hot corrosion behavior of the coatings
      was tested by applying a mixture of Na2SO4 and V2O5 onto the surface of TBC,
      followed by isothermal heat treatment at 1273 K for 50 h. The characterization
      of the corroded samples was performed by X-ray diffraction (XRD), scanning electron
      microscopy (SEM), and energy dispersive spectroscopy (EDS) to identify physical
      and chemical changes in the coatings. GIXRD was used to analyze the residual
      stresses of the coatings. Residual stress in the FGC coating was found to be
      −15.2 ± 10.6 MPa. The wear resistance of TBCs is studied using a linear reciprocating
      tribometer, and the results indicate that gadolinium zirconate-based TBCs showed
      better performance when deposited in bilayer and multilayered functionally graded
      TBC systems. The wear rate of as-coated FGC coatings was determined to be 2.90
      × 10−4 mm3/Nm, which is lower than the conventional YSZ coating.'
    - '[Thermal barrier coatings on niobium-based alloys structural materials (2019)]

      During thermocyclic creep, the properties of a niobium alloy with a two-layer
      combined coating were studied at a temperature of 1400 oС in air. A comparison
      of the data obtained with other coatings is made. The role of the shape and
      distribution of cracks in the mechanism of strength degradation of coatings
      is investigated. Consideration of many factors in the formation of the combined
      coating ensured an increase in its durability of 1.9...8.5 folds depending on
      the temperature mode of creep. The applied structural materials do not provide
      the relevant requirements for the development of modern technology, the need
      to increase their functionality. Thus, the operational capabilities of nickel
      alloys, which for decades have provided the aerospace complex, have almost reached
      the upper limit. One of the actually directions for solving the existing situation
      is the alternative use of new generation heat-resistant materials for modern
      highly reliable equipment. For example, the use of niobium-based alloys, the
      prospect of which is due to their physicomechanical properties than excellent
      similar products.'
    - '[Diagnosis of aerospace structure defects by a HPC implemented soft computing
      algorithm (arXiv:1610.05521, 2016)]

      This study concerns with the diagnosis of aerospace structure defects by applying
      a HPC parallel implementation of a novel learning algorithm, named U-BRAIN.
      The Soft Computing approach allows advanced multi-parameter data processing
      in composite materials testing. The HPC parallel implementation overcomes the
      limits due to the great amount of data and the complexity of data processing.
      Our experimental results illustrate the effectiveness of the U-BRAIN parallel
      implementation as defect classifier in aerospace structures. The resulting system
      is implemented on a Linux-based cluster with multi-core architecture.'
    - '[Radiation Damage Studies on Titanium Alloys as High Intensity Proton Accelerator
      Beam Window Materials (arXiv:1911.10198, 2019)]

      A high-strength dual alpha+beta phase titanium alloy Ti-6Al-4V is utilized as
      a material for beam windows in several accelerator target facilities. However,
      relatively little is known about how material properties of this alloy are affected
      by high-intensity proton beam irradiation. With plans to upgrade neutrino facilities
      at J-PARC and Fermilab to over 1 MW beam power, the radiation damage in the
      window material will reach a few displacements per atom (dpa) per year, significantly
      above the ~0.3 dpa level of existing data. The RaDIATE collaboration has conducted
      a high intensity proton beam irradiation of various target and window material
      specimens at BLIP facility, including a variety of titanium alloys. Post-Irradiation
      Examination of the specimens in the 1st capsule, irradiated at up to 0.25 dpa,
      is in progress. Tensile tests in a hot cell at PNNL exhibited a clear signature
      of radiation hardening and loss of ductility for Ti-6Al-4V, while Ti-3Al-2.5V,
      with less beta phase, exhibited less severe hardening. Microstructural investigations
      will follow to study the cause of the difference in tensile behavior between
      these alloys. High-cycle fatigue (HCF) performance is critical to the lifetime
      estimation of beam windows exposed to a periodic thermal stress from a pulsed
      proton beam. The 1st HCF data on irradiated titanium alloys are to be obtained
      by a conventional bend fatigue test at Fermilab and by an ultrasonic mesoscale
      fatigue test at Culham Laboratory. Specimens in the 2nd capsule, irradiated
      at up to ~1 dpa, cover typical titanium alloy grades, including possible radiation-resistant
      candidates. These systematic studies on the effects of radiation damage of titanium
      alloys are intended to enable us to predict realistic lifetimes of current beam
      windows made of Ti-6Al-4V and to extend the lifetime by choosing a more radiation
      and thermal shock tolerant alloy.'
    - '[On the effect of Ti on Oxidation Behaviour of a Polycrystalline Nickel-based
      Superalloy (arXiv:1810.10444, 2018)]

      Titanium is commonly added to nickel superalloys but has a well-documented detrimental
      effect on oxidation resistance. The present work constitutes the first atomistic-scale
      quantitative measurements of grain boundary and bulk compositions in the oxide
      scale of a current generation polycrystalline nickel superalloy performed through
      atom probe tomography. Titanium was found to be particularly detrimental to
      oxide scale growth through grain boundary diffusion.'
