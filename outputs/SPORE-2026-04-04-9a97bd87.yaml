impact_analysis:
  vulgarisation: Imaginez des aimants qui glissent parfaitement sur certaines surfaces
    sans aucune résistance - c'est la supraconductivité. Mais quand on applique un
    champ magnétique, des 'tourbillons' magnétiques se forment et bougent, créant
    de la résistance. Cette recherche propose d'utiliser des motifs spéciaux non-répétitifs
    (quasicristallins) pour 'coincer' ces tourbillons et maintenir la supraconductivité
    même avec des champs magnétiques forts.
  impact_concret: Des aimants supraconducteurs plus puissants et stables permettraient
    des IRM plus précises et accessibles, des trains à lévitation magnétique plus
    rapides et efficaces, des réseaux électriques sans perte d'énergie, et des moteurs
    électriques ultra-performants pour l'aviation électrique. Les data centers et
    ordinateurs quantiques deviendraient également beaucoup plus efficaces énergétiquement.
  industries_impactees:
  - Santé et imagerie médicale
  - Transport ferroviaire
  - Énergie et réseaux électriques
  - Aviation
  - Informatique quantique
  - Data centers
  taille_marche_estimee: Plusieurs centaines de milliards d'euros - le marché global
    des supraconducteurs représente déjà 7 milliards d'euros et pourrait exploser
    avec de meilleures performances
  horizon_temporel: Long terme (10-20 ans)
  solutions_existantes: Aujourd'hui on utilise des motifs périodiques réguliers pour
    piéger les tourbillons magnétiques, mais ils ne fonctionnent bien que dans certaines
    directions et à basse température. Cette approche quasicristalline promet un piégeage
    plus efficace dans toutes les directions et à plus haute température, simplifiant
    le refroidissement nécessaire.
  score_impact: significatif
  one_liner: Des supraconducteurs qui résistent mieux aux champs magnétiques pourraient
    rendre l'IRM accessible partout et permettre enfin l'aviation électrique long-courrier.
